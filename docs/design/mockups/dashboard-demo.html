<style>
/* Minimal premium: neutral surfaces, hairlines, one clinical-green accent used only for the active item, primary action and the main chart series. */
:root{--bg:#fbfbfa;--raised:#ffffff;--side:#f6f6f4;--sunken:#f1f1ef;
--ink:#16181a;--ink-2:#4a4f54;--ink-3:#6f757b;--ink-4:#9aa0a6;--line:#ebebe8;--line-2:#dfdfdb;--hover:rgba(22,24,26,.04);--press:rgba(22,24,26,.07);
--accent:#0b6e5f;--accent-2:#0a5f52;--accent-wash:rgba(11,110,95,.07);
--critical:#b42335;--success:#1f7a4d;--warning:#a86a0c;--muted:#6f757b;
--ease:cubic-bezier(.2,.7,.2,1);--sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--serif:"Instrument Serif",Georgia,serif}
html.dark{--bg:#111213;--raised:#161718;--side:#141516;--sunken:#1d1e20;--ink:#ececea;--ink-2:#b9bdc1;--ink-3:#8d9297;--ink-4:#6b7075;
--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.11);--hover:rgba(255,255,255,.04);--press:rgba(255,255,255,.07);
--accent:#3fb39d;--accent-2:#56c2ad;--accent-wash:rgba(63,179,157,.1);--critical:#e5677a;--success:#5cc08c;--warning:#d9a24a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
svg.lucide{width:16px;height:16px;stroke-width:1.6;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"} .mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s var(--ease)}
.app.rail{grid-template-columns:56px minmax(0,1fr)}

aside{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-head{height:56px;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px}
.wordmark{font:26px/1 var(--serif);letter-spacing:-.01em;color:var(--ink)} .wordmark small{font:500 11px var(--sans);color:var(--ink-4);margin-left:6px;letter-spacing:0}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--ink-4)} .icon-btn:hover{background:var(--hover);color:var(--ink)}
.sb-head .icon-btn{margin-left:auto}
.company{margin:2px 10px 12px;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px;text-align:left;width:calc(100% - 20px)}
.company:hover{background:var(--hover)}
.company .logo{width:28px;height:28px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2);display:grid;place-items:center;font:600 11px var(--sans);color:var(--ink-2);flex:none}
.company b{display:block;font-weight:500;font-size:13px;line-height:1.25} .company span{font-size:11.5px;color:var(--ink-4)}
.company svg{margin-left:auto;color:var(--ink-4);width:14px;height:14px}
nav.menu{flex:1;overflow:auto;padding:0 10px 16px;scrollbar-width:thin}
.grp{margin-top:1px}
.grp-btn{width:100%;height:32px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:7px;font-size:13.5px;color:var(--ink-2);text-align:left}
.grp-btn svg:first-child{color:var(--ink-4)}
.grp-btn:hover{background:var(--hover);color:var(--ink)}
.grp-btn .chev{margin-left:auto;color:var(--ink-4);transition:transform .2s var(--ease);width:13px;height:13px;opacity:0}
.grp-btn:hover .chev,.grp.open>.grp-btn .chev{opacity:1}
.grp.open>.grp-btn .chev{transform:rotate(90deg)}
.grp.has-active>.grp-btn{color:var(--ink);font-weight:500} .grp.has-active>.grp-btn svg:first-child{color:var(--ink-2)}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)} .grp.open>.sub{grid-template-rows:1fr}
.sub>div{overflow:hidden}
.sub ul{list-style:none;margin:1px 0 6px 16px;padding:0 0 0 10px;border-left:1px solid var(--line-2)}
.sub li a{display:flex;align-items:center;gap:8px;height:29px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--ink-3);text-decoration:none;white-space:nowrap;position:relative}
.sub li a:hover{background:var(--hover);color:var(--ink)}
.sub li a.active{color:var(--ink);font-weight:500;background:var(--raised);box-shadow:0 0 0 1px var(--line)}
.sub li a.active::before{content:"";position:absolute;left:-11px;top:8px;bottom:8px;width:1.5px;background:var(--accent)}
.sub li a kbd{margin-left:auto;font:400 10.5px var(--mono);color:var(--ink-4)}
.sub .w{font:500 9.5px var(--mono);color:var(--ink-4);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:3px;padding:0 3px}
.sec-h{font:500 11px var(--sans);color:var(--ink-4);padding:10px 8px 3px}
.sb-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:4px;align-items:center}
.sb-foot .who{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:2px 6px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font:500 11px var(--sans);color:var(--ink-2);flex:none}
.who b{display:block;font-size:12.5px;font-weight:500;line-height:1.2} .who span{font-size:11.5px;color:var(--ink-4)}
.app.rail .wordmark,.app.rail .company,.app.rail .grp-btn .lbl,.app.rail .grp-btn .chev,.app.rail .who div{display:none}
.app.rail .sb-head{padding:0;justify-content:center} .app.rail .sb-head .icon-btn{margin:0}
.app.rail nav.menu{padding:8px;overflow:visible} .app.rail .grp-btn{justify-content:center;padding:0;height:36px}
.app.rail .sub{display:none}
.app.rail .grp.fly>.sub{display:block;position:fixed;left:60px;top:var(--fly-top,60px);background:var(--raised);border-radius:10px;box-shadow:0 0 0 1px var(--line-2),0 8px 24px rgba(0,0,0,.08);padding:6px;z-index:30;min-width:230px;max-height:calc(100vh - var(--fly-top,60px) - 12px);overflow:auto}
.app.rail .grp.fly>.sub ul{border:0;margin:0;padding:0} .app.rail .grp.fly>.sub li a.active::before{display:none}
.app.rail .grp.fly>.sub::before{content:attr(data-title);display:block;font-weight:500;font-size:12px;color:var(--ink-4);padding:4px 8px 4px}
.app.rail .grp.fly>.grp-btn,.app.rail .grp.has-active>.grp-btn{background:var(--raised);box-shadow:0 0 0 1px var(--line)}
.app.rail .who{flex:none;padding:0} .app.rail .sb-foot{flex-direction:column}

header.top{position:sticky;top:0;z-index:10;height:56px;display:flex;align-items:center;gap:8px;padding:0 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-4);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:500} .crumb svg{width:12px;height:12px}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--raised);color:var(--ink-4);font-size:13px;width:280px;white-space:nowrap;overflow:hidden}
.search kbd{margin-left:auto;font:400 11px var(--mono);color:var(--ink-4)}
.pill-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink-3);white-space:nowrap} .pill-btn:hover{background:var(--hover);color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:0 6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.bell{position:relative} .bell i{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mobile-menu{display:none}

main{min-width:0}
.page{max-width:1240px;margin:0 auto;padding:36px 32px 72px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:28px}
.eyebrow{font-size:12.5px;color:var(--ink-4);margin:0 0 6px}
.ph h1{font:600 28px/1.15 var(--sans);letter-spacing:-.025em;margin:0}
.ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{height:34px;padding:0 13px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .14s}
.btn.primary{background:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-2)}
html.dark .btn.primary{color:#0b1f1b}
.btn.outline{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--raised);color:var(--ink-2)} .btn.outline:hover{background:var(--hover);color:var(--ink)}

<script>
/* Menu: docs/design/NAVIGATION.md. [label, route, shortcut, wholesaleOnly, section] */
const NAV = [
 {g:"Dashboard",icon:"layout-dashboard",items:[["Home dashboard","/dashboard","G H"],["Retail dashboard","/dashboard/retail"],["Wholesale dashboard","/dashboard/wholesale","",1],["Inventory dashboard","/dashboard/inventory"],["Financial dashboard","/dashboard/finance"],["Branch dashboard","/dashboard/branches"]]},
 {g:"Sales",icon:"receipt",items:[["POS Billing","/sales/pos","G P"],["Sales Invoices","/sales/invoices","G I"],["Sales Orders","/sales/orders","G O",1],["Quotations","/sales/quotations"],["Delivery Challans","/sales/challans","",1],["Sales Returns","/sales/returns","G E"],["Credit Notes","/sales/credit-notes"]]},
 {g:"Purchase",icon:"shopping-cart",items:[["Purchase Orders","/purchase/orders","G Q"],["Purchase Invoices","/purchase/invoices","G U"],["Goods Received","/purchase/grn","G N"],["Purchase Returns","/purchase/returns"],["Debit Notes","/purchase/debit-notes"],["Purchase Import","/purchase/import"]]},
 {g:"Inventory",icon:"boxes",items:[["Stock Overview","/inventory/stock","G K"],["Batch Management","/inventory/batches"],["Stock Transfers","/inventory/transfers"],["Stock Adjustments","/inventory/adjustments"],["Expiry Management","/inventory/expiry","G X"],["Reorder Management","/inventory/reorder"],["Stock Audit","/inventory/audit"]]},
 {g:"Masters",icon:"database",items:[
   ["Medicine Master","/masters/items","G M",0,"Inventory masters"],["Generic / Salt","/masters/salts","",0,"Inventory masters"],["Brands","/masters/brands","",0,"Inventory masters"],["Manufacturers","/masters/manufacturers","",0,"Inventory masters"],["Categories","/masters/categories","",0,"Inventory masters"],["Drug Schedules","/masters/schedules","",0,"Inventory masters"],["Units & Taxes","/masters/units","",0,"Inventory masters"],
   ["Suppliers","/masters/suppliers","G V",0,"Party masters"],["Customers","/masters/customers","G C",0,"Party masters"],["Customer Groups","/masters/customer-groups","",0,"Party masters"],["Doctors","/masters/doctors","G D",0,"Party masters"],["Salesmen","/masters/salesmen","",1,"Party masters"],
   ["Ledger Groups","/finance/account-groups","G A",0,"Accounts masters"],["Ledgers","/finance/accounts","G L",0,"Accounts masters"],["Posting Rules","/finance/posting-rules","",0,"Accounts masters"],["TDS / TCS Sections","/finance/tds-sections","",0,"Accounts masters"]]},
 {g:"Wholesale",icon:"truck",items:[["Distributor Orders","/wholesale/distributor-orders"],["Retailer Orders","/wholesale/retailer-orders","",1],["Bulk Billing","/wholesale/billing","G W",1],["Price Lists","/wholesale/price-lists","",1],["Schemes & Offers","/wholesale/schemes"],["Credit Limits","/wholesale/credit","",1],["Delivery Management","/wholesale/delivery","",1]]},
 {g:"Finance",icon:"landmark",items:[["Cash & Bank","/finance/cash-book","G B"],["Receipts","/finance/receipts"],["Payments","/finance/payments"],["Expenses","/finance/expenses"],["General Ledger","/finance/ledger"],["Journal Entries","/finance/journal","G J"],["Fixed Assets","/finance/assets"],["Loans","/finance/loans"],["Bank Reconciliation","/finance/bank-reconciliation"],["Financial Statements","/finance/statements"]]},
 {g:"CRM & Engagement",icon:"heart-handshake",items:[["Prescription Records","/compliance/prescriptions"],["Customer History","/crm/customers"],["Reminders","/crm/reminders"],["Loyalty","/crm/loyalty"],["Complaints","/crm/complaints"],["Notifications","/notifications"]]},
 {g:"Reports",icon:"bar-chart-3",items:[["Reports Centre","/reports","G R"],["Sales Reports","/reports/sales"],["Purchase Reports","/reports/purchase"],["Stock Reports","/reports/stock"],["Expiry Reports","/reports/expiry"],["Profit Reports","/reports/profit"],["GST Reports","/reports/gst"],["Financial Reports","/reports/financial"]]},
 {g:"GST & Compliance",icon:"shield-check",items:[["GST Summary","/gst","G T"],["GSTR Preparation","/gst/gstr-1"],["E-invoice & E-way Bill","/gst/e-invoices","",1],["Input Tax Credit","/gst/itc"],["Statutory Registers","/compliance/registers","G Z"],["Drug Licences","/compliance/licences"],["Regulatory Audit","/compliance/audit"]]},
 {g:"Administration",icon:"settings-2",items:[["Settings Home","/admin","G ,"],["Company Settings","/admin/company"],["Branches & Warehouses","/admin/branches"],["Users & Roles","/admin/users"],["Approval Workflows","/admin/approvals"],["Audit Logs","/admin/audit"],["Integrations","/admin/integrations"],["Subscriptions","/admin/subscription"]]},
];
let active = "/dashboard";
const openGroups = new Set(["Dashboard"]);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderMenu(){
  $("menu").innerHTML = NAV.map(g => {
    let sec = "", lis = "";
    for (const [label, route, kbd, w, section] of g.items) {
      if (section && section !== sec) { sec = section; lis += `<li class="sec-h">${section}</li>`; }
      lis += `<li><a href="#${route}" data-route="${route}" class="${route===active?"active":""}">${esc(label)}${w?' <span class="w" title="Wholesale edition only">W</span>':""}${kbd?`<kbd>${kbd}</kbd>`:""}</a></li>`;
    }
    const has = g.items.some(i => i[1]===active);
    return `<div class="grp ${openGroups.has(g.g)?"open":""} ${has?"has-active":""}" data-g="${esc(g.g)}">
      <button class="grp-btn" aria-expanded="${openGroups.has(g.g)}" title="${esc(g.g)}"><i data-lucide="${g.icon}"></i><span class="lbl">${esc(g.g)}</span><i data-lucide="chevron-right" class="chev"></i></button>
      <div class="sub" data-title="${esc(g.g)}"><div><ul>${lis}</ul></div></div></div>`;
  }).join("");
  lucide.createIcons();
}
$("menu").addEventListener("click", e => {
  const b = e.target.closest(".grp-btn");
  if (b && $("app").classList.contains("rail")) return;
  if (b) { const g = b.parentElement.dataset.g; openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g); renderMenu(); return; }
  const a = e.target.closest("a[data-route]");
  if (a) { e.preventDefault(); go(a.dataset.route); $("app").classList.remove("mob-open"); }
});

function findItem(route){ for (const g of NAV) for (const i of g.items) if (i[1]===route) return {g, i}; return null; }
function go(route){
  active = route; const f = findItem(route);
  if (f) openGroups.add(f.g.g);
  history.replaceState(null, "", "#" + route);
  $("crumb").innerHTML = f ? `<span>${esc(f.g.g)}</span>${f.i[4]?`<i data-lucide="chevron-right"></i><span>${f.i[4]}</span>`:""}<i data-lucide="chevron-right"></i><b>${esc(f.i[0])}</b>` : "";
  const isPos = route === "/sales/pos";
  $("page").classList.toggle("wide", isPos);
  if (isPos && !go.wasPos) { go.railBefore = $("app").classList.contains("rail"); $("app").classList.add("rail"); }
  if (!isPos && go.wasPos && !go.railBefore) $("app").classList.remove("rail");
  go.wasPos = isPos;
  const dk = KIND_OF(route);
  $("page").innerHTML = route === "/dashboard" ? dashboard() : isPos ? posPage() : (route === "/masters/items" || dk || PMK(route)) ? "" : placeholder(f);
  renderMenu(); window.scrollTo(0,0);
  if (isPos) posInit();
  if (route === "/masters/items") { IM.view="list"; IM.open=null; renderItems(); }
  if (dk) { DS.kind=dk; DS.view="list"; DS.D=null; DS.flt="all"; DS.q=""; renderDoc(); }
  const pk = PMK(route);
  if (pk) { Object.assign(PM,{kind:pk,view:"list",open:null,q:"",flt:"all"}); renderPM(); }
}

const money = n => "₹" + Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const short = n => n >= 1e7 ? "₹" + (n/1e7).toFixed(2) + " Cr" : n >= 1e5 ? "₹" + (n/1e5).toFixed(2) + " L" : money(n);

function kpi(label,value,delta,good,foot){ return `<div class="kpi"><div class="l">${label}</div><div class="v num">${value}</div><div class="d">${delta?`<span class="${good?"up":"down"}">${delta}</span> vs yesterday`:foot}</div></div>`; }
const rupee = n => `<small>₹</small>${Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const lakh = n => `<small>₹</small>${(n/1e5).toFixed(2)} L`;

function landCost(){ const v=parseFloat(IM.F.purchaseRate); const p=v>0?Math.round(v*100):ptr(); return p!=null?rs(p):"—"; }
function tabOf(k){ return ["name","printName","code","image","dept","brand","mfr","marketedBy","cat","subCat","thera","theraSub","nature","kit","conv","shelf","warranty","barcodes","remarks"].includes(k)?0:["comp","comps","form","pack","schedule","storage","rack"].includes(k)?1:["hsn","mrp","discRecv","purchaseRate","pts","salePrice","discAllowed","maxDisc","minMarkup","maxMarkup","commission"].includes(k)?2:3; }
function validate(){
  const F=IM.F, e={}, num=v=>v===""||v==null?null:Number(v), pct=k=>{ const v=num(F[k]); if(v!=null&&(isNaN(v)||v<0||v>100)) e[k]="Enter 0 to 100."; }, pharma=F.dept==="Pharma";
  if(!String(F.name).trim()) e.name="Enter the product name."; else if(CATALOG.some(c=>c.id!==IM.editId&&c.name.trim().toLowerCase()===String(F.name).trim().toLowerCase())) e.name="A medicine with this name already exists.";
  if(pharma&&!String(F.mfr).trim()) e.mfr="Manufacturer is required for pharma items.";
  if(!(parseInt(F.conv)>0)) e.conv="Conversion must be a whole number above 0.";
  if(pharma&&!(parseInt(F.shelf)>0)) e.shelf="Enter shelf life in months.";
  const w=num(F.warranty); if(w!=null&&(!Number.isInteger(w)||w<1||w>120)) e.warranty="Warranty is a whole number from 1 to 120.";
  if(String(F.barcodes).trim()&&!String(F.barcodes).split(",").every(b=>/^(\d{8}|\d{12,13})$/.test(b.trim()))) e.barcodes="Barcodes must be 8, 12 or 13 digits.";
  if(F.comps.some(c=>!String(c.salt).trim()&&String(c.strength).trim())) e.comps="Enter the salt for each strength.";
  else if(new Set(F.comps.map(c=>c.salt.trim().toLowerCase()).filter(Boolean)).size<F.comps.filter(c=>c.salt.trim()).length) e.comps="A salt is listed twice.";
  else if(pharma&&!F.comps.some(c=>String(c.salt).trim())) e.comps="Composition is required for pharma items.";
  if(!F.schedule) e.schedule="Pick the schedule.";
  const mrp=num(F.mrp), g=gstOf(F.hsn), mEx=mrp?mrp*100/(100+g):null; if(mrp!=null&&(isNaN(mrp)||mrp<=0)) e.mrp="MRP must be more than 0.";
  ["purchaseRate","pts"].forEach(k=>{ const v=num(F[k]); if(v!=null&&(isNaN(v)||v<=0)) e[k]="Enter a rate above 0."; else if(v!=null&&mEx&&v>mEx+0.005) e[k]=`Can't be above MRP ex-GST (₹${mEx.toFixed(2)}).`; });
  const sp=num(F.salePrice); if(sp!=null&&(isNaN(sp)||sp<=0)) e.salePrice="Enter a price above 0."; else if(sp!=null&&mrp&&sp>mrp) e.salePrice="Sales price can't be above MRP.";
  ["discRecv","discAllowed","maxDisc","minMarkup","commission"].forEach(pct);
  if(!e.discAllowed&&!e.maxDisc&&num(F.discAllowed)>num(F.maxDisc)) e.discAllowed="Can't be above the maximum discount.";
  const mx=num(F.maxMarkup); if(mx!=null&&(isNaN(mx)||mx<0||mx>1000)) e.maxMarkup="Enter 0 to 1000."; else if(mx!=null&&mx<num(F.minMarkup)) e.maxMarkup="Can't be below the minimum mark-up.";
  const lt=num(F.lead); if(lt!=null&&(!Number.isInteger(lt)||lt<0||lt>365)) e.lead="Lead time is 0 to 365 days.";
  const vs=F.vendors.filter(Boolean); if(new Set(vs).size<vs.length) e.vendors="Each vendor can be ranked only once.";
  F.levels.forEach((l,i)=>{ const a=+l.min,b=+l.reorder,c=+l.max; if([a,b,c].some(x=>isNaN(x)||x<0)||!(a<=b&&b<=c)) e["lv"+i]=1; });
  return e;
}

function bindForm(){
  const body=document.querySelector(".f-wrap");
  body.addEventListener("input",e=>{ const el=e.target;
    if(el.dataset.k&&el.type!=="checkbox"){ IM.F[el.dataset.k]=el.value; IM.dirty=true; if(IM.errs[el.dataset.k]){ delete IM.errs[el.dataset.k]; } }
    if(el.dataset.lv){ IM.F.levels[+el.dataset.lv][el.dataset.lk]=el.value; IM.dirty=true; delete IM.errs["lv"+el.dataset.lv]; }
    if(["mrp","discRecv","purchaseRate"].includes(el.dataset.k)&&$("ptrOut")){ const p=ptr(); $("ptrOut").textContent=p!=null?rs(p):"—"; $("lcOut").textContent=landCost(); }
    if(el.dataset.ck!=null){ IM.F.comps[+el.dataset.ck][el.dataset.cf]=el.value; IM.F.comp=compStr(IM.F.comps); IM.dirty=true; delete IM.errs.comps; el.classList.remove("bad"); const o=$("compOut"); if(o) o.textContent=IM.F.comp||"—"; }
    if(el.id==="ddq"){ IM.ddq=el.value; IM.ddi=0; refreshForm("ddq"); }
  });
  body.addEventListener("change",e=>{ const el=e.target;
    if(el.dataset.img){ const f=el.files[0]; if(f&&f.size>1048576){ IM.errs.image="Image is larger than 1 MB."; el.value=""; } else { IM.F.image=f?f.name:""; delete IM.errs.image; IM.dirty=true; } refreshForm(); return; }
    if(el.dataset.vi!=null){ IM.F.vendors[+el.dataset.vi]=el.value; IM.dirty=true; delete IM.errs.vendors; refreshForm(el.id); return; }
    if(el.type==="checkbox"){ IM.F[el.dataset.k]=el.checked; IM.dirty=true; }
    if(el.tagName==="SELECT"&&el.dataset.k){ const k=el.dataset.k; IM.F[k]=el.value; IM.dirty=true; delete IM.errs[k];
      if(k==="dept"&&el.value==="Pharma"){ IM.F.batchOn=true; IM.F.expiryOn=true; }
      if(k==="cat"&&!(SUBCATS[el.value]||[]).includes(IM.F.subCat)) IM.F.subCat="";
      if(k==="thera"&&!(THERA[el.value]||[]).includes(IM.F.theraSub)) IM.F.theraSub="";
      refreshForm(el.id); }
    else if(el.dataset.k&&!["ddq"].includes(el.id)) refreshForm(null,true);
  });
  body.addEventListener("click",e=>{ const tb=e.target.closest("[data-tab]"); if(tb){ IM.tab=+tb.dataset.tab; refreshForm(); return; }
    if(e.target.closest("[data-cadd]")){ IM.F.comps.push({salt:"",strength:""}); IM.dirty=true; renderItems(); const n=$("f_comp_"+(IM.F.comps.length-1)); n&&n.focus(); return; }
    const cr=e.target.closest("[data-crm]"); if(cr){ IM.F.comps.splice(+cr.dataset.crm,1); IM.F.comp=compStr(IM.F.comps); IM.dirty=true; delete IM.errs.comps; renderItems(); return; }
    const s=e.target.closest("[data-s]"); if(s){ IM.F.schedule=s.dataset.s; IM.dirty=true; delete IM.errs.schedule; refreshForm(); return; }
    const d=e.target.closest("[data-dd]"); if(d) fillFromDrugDB(d.dataset.dd); });
  $("ddq").addEventListener("keydown",e=>{ const list=[...document.querySelectorAll("[data-dd]")]; if(!list.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); IM.ddi=(IM.ddi+(e.key==="ArrowDown"?1:-1)+list.length)%list.length; list.forEach((b,i)=>b.classList.toggle("on",i===IM.ddi)); }
    if(e.key==="Enter"){ e.preventDefault(); fillFromDrugDB(list[IM.ddi].dataset.dd); } });
  ["fSave","fSave2"].forEach(id=>$(id).onclick=saveItem); ["fCancel","fCancel2"].forEach(id=>$(id).onclick=cancelForm);
  if($("cfStay")){ $("cfStay").onclick=()=>{ IM.confirm=false; refreshForm(); }; $("cfLeave").onclick=()=>{ IM.view="list"; IM.confirm=false; renderItems(); }; }
}
// Re-render the form but keep the caret where the user was typing.
function refreshForm(keepId, soft){
  const a=document.activeElement, id=keepId||(a&&a.id), pos=a&&a.selectionStart; if(soft) return;
  renderItems(); const n=id&&$(id); if(n){ n.focus(); if(pos!=null&&n.setSelectionRange) try{ n.setSelectionRange(pos,pos); }catch(_){} }
}
function fillFromDrugDB(pid){
  const d=DRUGDB.find(x=>x.product_id===pid); if(!d) return; const F=IM.F, pk=(d.packaging||"").match(/^(\w+)\s+of\s+(\d+)\s*(\w+)?/i)||[];
  Object.assign(F,{name:d.name,printName:d.name.replace(/ Tablet| Capsule/,""),mfr:(d.manufacturer||"").replace(/\s+(Ltd|Limited|Pvt|Private)\b.*$/i,""),comp:d.composition&&d.composition!=="None"?d.composition:"",
    form:FORMS.find(f=>new RegExp(f,"i").test(d.dosage_form||d.name))||"Other",pack:d.packaging||"",mrp:String(d.mrp),schedule:d.rx_required?"":"OTC",dept:d.kind==="drug"?"Pharma":"OTC",cat:guessCat(d.composition||""),
    brand:d.name.split(/[\s-]/)[0],comps:parseComp(d.composition&&d.composition!=="None"?d.composition:""),thera:THERA_OF(d.composition||"",d.kind!=="drug"),subCat:"",theraSub:""});

function docTotals(D){
  const T=dtot(D), p=party(D), inter=dopts(D).inter, k=D.kind, rates=Object.keys(T.rates).sort((a,b)=>a-b);
  const L=(l,v,c="")=>`<div class="tl ${c}"><span>${l}</span><span>${v}</span></div>`;
  let h=`<h3 style="margin-bottom:10px">Totals</h3>`+L(`Gross · ${D.lines.length} lines, ${T.qty} qty + ${T.free} free`,rs(T.gross))
    +L(k==="pi"?"Less: scheme, trade and cash discount":k==="si"?"Less: item and bill discount":"Less: discount",T.disc?"−"+rs(T.disc):rs(0),"disc")
    +(T.ret?L("Less: returns (credit note)","−"+rs(T.ret)):"")+L("Taxable value",rs(T.taxable))
    +rates.map(r=>{ const x=T.rates[r]; return inter?L(`IGST ${r}% on ${rs(x.taxable)}`,rs(x.igst),"tax"):L(`CGST ${r/2}% + SGST ${r/2}% on ${rs(x.taxable)}`,`${rs(x.cgst)} + ${rs(x.sgst)}`,"tax"); }).join("")
    +L(inter?"IGST":"GST (CGST + SGST)",rs(T.gst))
    +[["freight","Freight"],["insurance","Insurance"],["packing","Packing"],["other","Other charges"]].filter(([x])=>pz(D[x])).map(([x,l])=>L(l,rs(pz(D[x])))).join("")
    +L("Round off",(T.ro<0?"−":"+")+rs(Math.abs(T.ro)))
    +`<div class="grand"><span>${k==="po"?"Order value":k==="pi"?"Bill total":"Invoice total"}</span><b>${rs(T.grand)}</b></div>`
    +`<div class="hint" style="margin-top:6px;font-size:12px;color:var(--ink-4)">Rupees ${words(Math.round(Math.abs(T.grand)/100))} Only</div>`;
  if(k==="pi"){ const typed=String(D.billTotal).trim(), bt=pz(typed), diff=bt-T.grand;
    h+=L("Input GST (ITC)",D.itc==="Yes"?rs(T.gst):"Not claimable")+(typed===""?`<div class="need">Type the supplier's bill total to check the lines.</div>`:Math.abs(diff)<=100?`<div class="need" style="color:var(--success)">Matches the supplier bill (${rs(bt)}).</div>`:`<div class="need err">Supplier bill says ${rs(bt)}: differs by ${rs(Math.abs(diff))}.</div>`); }
  if(k==="si"&&p){ const after=p.outstanding+(D.payMode==="Credit"?T.grand:0), pct=Math.min(100,Math.round(after*100/p.limit));
    h+=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">${L("Outstanding before",rs(p.outstanding))}${L("After this invoice",rs(after))}${L("Credit limit",rs(p.limit))}<div class="meter ${pct>=100?"crit":pct>=85?"warn":"accent"}"><i style="width:${pct}%"></i></div></div>`; }
  return h;
}
function docAlerts(D){
  const k=D.kind, p=party(D), T=dtot(D), dd=k==="pi"?D.supDate:D.date, out=[], A=(crit,m,extra="")=>out.push(`<div class="alert ${crit?"crit":""}"><i data-lucide="alert-octagon"></i><span class="m">${m}</span>${extra}</div>`);
  if(p&&p.dlExp<dd) A(1,`${esc(p.name)}'s drug licence expired on ${fmtD(p.dlExp)}. ${k==="si"?"Sales to":"Purchases from"} this party are blocked until the licence is renewed in the party master ⚠.`);
  else if(p&&p.dlExp<=addDays(dd,60)) A(0,`${esc(p.name)}'s drug licence expires on ${fmtD(p.dlExp)}.`);
  if(k==="si"&&p&&D.payMode==="Credit"&&p.outstanding+T.grand>p.limit) A(1,`Credit limit exceeded: ${rs(p.outstanding+T.grand)} against a limit of ${rs(p.limit)}.`,`<label class="tgl"><input type="checkbox" data-d="override" ${D.override?"checked":""}>Allow with approval (sales.credit.override)</label>`);
  if(k==="si"&&T.grand>5000000&&!String(D.vehicle).trim()) A(0,"Invoice is above ₹50,000: the e-way bill needs the vehicle number (threshold from settings ⚠).");

}

  D.lines.forEach((l,i)=>{ const c=dcalc(l,o), s=c.sign<0?"−":""; set(`lc${i}t`,s+r2(c.taxable)); set(`lc${i}g`,s+r2(c.gst)); set(`lc${i}a`,s+r2(c.amt)); if(lc){ set(`lc${i}l`,lc[i].unit); set(`lc${i}m`,lc[i].margin); } });

function docAdd(id){
  const D=DS.D, it=itemOf(id), k=D.kind;
  if(k==="si"&&!fefo(it)){ toast("No saleable batch of this item in stock"); return; }
  if(k==="po"){ const ex=D.lines.findIndex(l=>l.id===id); if(ex>=0){ D.lines[ex].qty=String((parseInt(D.lines[ex].qty)||0)+1); DS.dirty=true; renderDoc(); toast("Already on the PO: quantity increased"); return; } }
  D.lines.push(newLine(k,it,D)); DS.dirty=true; delete DS.errs.lines; renderDoc();
  const n=document.querySelector(`[data-l="${D.lines.length-1}"][data-f="${k==="pi"?"batch":"qty"}"]`); if(n){ n.focus(); n.select(); }
}

    const d=e.target.closest("[data-del]"); if(d){ D.lines.splice(+d.dataset.del,1); DS.dirty=true; DS.errs={}; renderDoc(); return; } });
  $("dres").addEventListener("mousedown",e=>{ const r=e.target.closest("[data-dd]"); if(r){ e.preventDefault(); docAdd(+r.dataset.dd); } });

      if(el.dataset.f==="sec"){ l.sec=el.value; if(SECTIONS.find(s=>s[0]===l.sec)[2]>0) l.reason=""; }

    if(e.key==="Enter"){ e.preventDefault(); $("dq").focus(); return; }

function validateDoc(D){
  const e={}, k=D.kind, p=party(D), o=dopts(D), T=dtot(D), dk=k==="pi"?"supDate":"date", dd=D[dk], MY=/^(0[1-9]|1[0-2])\/\d{2}$/;
  if(!p) e.party=`Pick the ${KIND[k].party.toLowerCase()}.`; else if(p.dlExp<dd) e.party=`Drug licence expired on ${fmtD(p.dlExp)}.`;
  if(!dd) e[dk]="Enter the date."; else if(dd>TODAY_ISO) e[dk]="Date can't be after today."; else if(dd<"2026-04-01") e[dk]="Date is before FY 2026-27.";
  if(k==="po"&&D.expected&&D.expected<D.date) e.expected="Can't be before the PO date.";
  if(k==="pi"){ const sn=String(D.supNo).trim().toLowerCase();
    if(!sn) e.supNo="Enter the supplier's invoice number.";
    else if(DOCS.pi.some(x=>x!==DS.orig&&x.status!=="Draft"&&x.party===D.party&&String(x.supNo).trim().toLowerCase()===sn)) e.supNo="This supplier invoice is already entered this year.";
    if(D.recvDate&&D.recvDate<D.supDate) e.recvDate="Goods can't arrive before the bill date.";
    const bt=String(D.billTotal).trim(); if(bt===""||isNaN(+bt)) e.billTotal="Type the total printed on the supplier's bill."; else if(Math.abs(pz(bt)-T.grand)>100) e.billTotal=`Lines add up to ${rs(T.grand)}; the bill says ${rs(pz(bt))}.`; }
  if(k==="si"&&p&&D.payMode==="Credit"&&p.outstanding+T.grand>p.limit&&!D.override) e.credit="Credit limit exceeded. Tick “Allow with approval” or take payment.";
  if(k==="si"&&D.payMode==="Cheque"){ if(!/^\d{6}$/.test(String(D.chqNo||"").trim())) e.chqNo="Cheque number is 6 digits.";
    if(!D.chqDate) e.chqDate="Enter the cheque date."; else if(D.chqDate<addDays(D.date,-90)) e.chqDate="Cheque is more than 3 months old (stale).";
    if(!String(D.bank||"").trim()) e.bank="Enter the bank the cheque is drawn on."; }
  if(k==="si"&&D.payMode==="UPI"&&String(D.payRef||"").trim()&&!/^\d{12}$/.test(String(D.payRef).replace(/\s/g,""))) e.payRef="UPI reference is 12 digits.";
  if(!D.lines.length) e.lines="Add at least one item.";
  D.lines.forEach((l,i)=>{ const E=(f,m)=>e[`l${i}_${f}`]=m, g=l.gst, mrp=parseFloat(l.mrp), rate=parseFloat(l.rate), qty=Number(l.qty), free=Number(l.free||0);
    if(!Number.isInteger(qty)||qty<=0) E("qty","Quantity must be a whole number above 0.");
    if(!Number.isInteger(free)||free<0) E("free","Free quantity must be 0 or more.");
    if(!(mrp>0)) E("mrp","MRP must be more than 0.");
    if(!(rate>0)) E("rate","Rate must be more than 0.");
    else if(mrp>0&&(o.incl?rate*100/(100+g):rate)>mrp*100/(100+g)+0.005) E("rate","Rate is above MRP (ex-GST).");
    ["sch","td","cd","disc"].forEach(f=>{ if(l[f]!=null&&String(l[f]).trim()!==""){ const v=+l[f]; if(isNaN(v)||v<0||v>100) E(f,"Discount must be 0 to 100."); } });
    if(k==="pi"){ const b=String(l.batch||"").trim(); if(!b) E("batch","Enter the batch number."); else if(b.length>30) E("batch","Batch is 30 characters at most.");
      if(!MY.test(l.exp||"")) E("exp","Expiry as MM/YY."); else if(daysLeft(l.exp)<=0) E("exp","Batch has expired: it can't be purchased.");
      if(l.mfg){ if(!MY.test(l.mfg)) E("mfg","Mfg as MM/YY."); else if(MY.test(l.exp||"")&&expDate(l.mfg)>=expDate(l.exp)) E("mfg","Mfg must be before expiry."); } }
    if(k==="si"){ const b=itemOf(l.id).batches[l.b], out=l.sec==="S"||l.sec==="P";
      if(out&&(!b||daysLeft(b[1])<=0)) E("b","Expired batch can't be sold."); else if(out&&qty+free>b[3]) E("qty",`Only ${b[3]} in stock in batch ${b[0]}.`);
      if(!out&&!String(l.reason||"").trim()) E("reason","Give a reason for the return."); } });
  return e;
}
function docSave(post){
  const D=DS.D, k=D.kind, K=KIND[k];
  DS.errs = post ? validateDoc(D) : (D.party<0 ? {party:`Pick the ${K.party.toLowerCase()} before saving a draft.`} : {});
  const keys=Object.keys(DS.errs);
  if(keys.length){ renderDoc(); const x=keys[0], m=x.match(/^l(\d+)_(\w+)/);
    const n=m?document.querySelector(`[data-l="${m[1]}"][data-f="${m[2]}"]`):x==="credit"?document.querySelector('[data-d="override"]'):x==="lines"?$("dq"):$("d_"+x);
    if(n){ n.focus(); n.scrollIntoView({block:"center"}); } toast(`${keys.length} thing${keys.length>1?"s":""} to fix before ${post?"posting":"saving"}`); return; }
  const list=DOCS[k], at=DS.orig?list.indexOf(DS.orig):-1; if(at>=0) list[at]=D; else list.unshift(D);
  if(!post){ D.status="Draft"; toast("Draft saved. It writes nothing to stock or books."); docLeave(); return; }
  D.no=nextNo(k); const p=party(D), T=dtot(D);
  if(k==="po"){ D.status="Sent"; toast(D.sendVia==="Don't send"?`PO ${D.no} saved`:`PO ${D.no} sent to ${p.name} by ${D.sendVia.toLowerCase()} (demo)`); }
  if(k==="pi"){ D.status="Posted";
    D.lines.forEach(l=>{ const it=itemOf(l.id), mrp=pz(l.mrp), u=(parseInt(l.qty)||0)+(parseInt(l.free)||0), b=String(l.batch).trim(), ex=it.batches.find(x=>x[0]===b&&x[1]===l.exp&&x[2]===mrp); if(ex) ex[3]+=u; else it.batches.push([b,l.exp,mrp,u]); });
    const po=D.po&&DOCS.po.find(x=>x.no===D.po);
    if(po){ D.lines.forEach(l=>{ const pl=po.lines.find(x=>x.id===l.id&&(x.received||0)<(parseInt(x.qty)||0)); if(pl) pl.received=Math.min(parseInt(pl.qty),(pl.received||0)+(parseInt(l.qty)||0)); }); po.status=po.lines.every(x=>(x.received||0)>=(parseInt(x.qty)||0))?"Closed":"Partially received"; }
    toast(`Purchase ${D.no} posted: ${D.lines.length} batch${D.lines.length>1?"es":""} added to stock${po?", "+po.no+" "+po.status.toLowerCase():""}`); }
  if(k==="si"){ D.status="Posted";
    D.lines.forEach(l=>{ const b=itemOf(l.id).batches[l.b]; if(!b) return; const u=(parseInt(l.qty)||0)+(parseInt(l.free)||0); if(l.sec==="S"||l.sec==="P") b[3]-=u; else if(l.sec==="R") b[3]+=u; });
    if(D.payMode==="Credit") p.outstanding+=T.grand;
    toast(`Invoice ${D.no} posted to ${p.name}'s ledger`); }
  docLeave(); if(k==="si") openInvoice(D);
}
addEventListener("keydown",e=>{

    return;
  }
  if(PM.open){ if(k==="Escape"){ e.preventDefault(); PM.open=null; renderPM(); } else if(k.toLowerCase()==="e"&&!typing){ e.preventDefault(); pmOpenForm(PM.open); } return; }
  if(k==="/"&&!typing){ e.preventDefault(); $("pmq").focus(); }
  else if(k.toLowerCase()==="n"&&!typing&&!e.ctrlKey&&!e.metaKey){ e.preventDefault(); pmOpenForm(null); }
});

function placeholder(f){
  if (!f) return "";
  return `<div class="ph"><div><p class="eyebrow mono">${f.i[1]}</p><h1>${esc(f.i[0])}</h1></div><div class="actions"><button class="btn outline" onclick="go('/dashboard')">Back to dashboard</button></div></div>
  <div class="card placeholder"><div><i data-lucide="${f.g.icon}"></i><h2>${esc(f.i[0])} goes here</h2><p>This static demo only draws the home dashboard. The menu item, breadcrumb and route are real.${f.i[3]?" Shown only for wholesale-edition companies.":""}</p></div></div>`;
}

// Rail mode: show a group's items in a fly-out next to its icon.
let flyTimer;
$("menu").addEventListener("mouseover", e => {
  if (!$("app").classList.contains("rail")) return;
  const g = e.target.closest(".grp"); if (!g) return;
  clearTimeout(flyTimer);
  document.querySelectorAll(".grp.fly").forEach(x => x !== g && x.classList.remove("fly"));
  if (!g.classList.contains("fly")) { const r = g.querySelector(".grp-btn").getBoundingClientRect(); g.style.setProperty("--fly-top", Math.min(r.top, innerHeight - 200) + "px"); g.classList.add("fly"); }
});
$("menu").addEventListener("mouseleave", () => { flyTimer = setTimeout(() => document.querySelectorAll(".grp.fly").forEach(x => x.classList.remove("fly")), 250); });
$("collapse").onclick = () => { $("app").classList.toggle("rail"); };
$("mob").onclick = () => $("app").classList.add("mob-open");
$("scrim").onclick = () => $("app").classList.remove("mob-open");
$("theme").onclick = () => { document.documentElement.classList.toggle("dark"); };
addEventListener("keydown", e => { if (e.ctrlKey && e.key.toLowerCase()==="b") { e.preventDefault(); $("app").classList.toggle("rail"); } });
go(location.hash.slice(1) && findItem(location.hash.slice(1)) ? location.hash.slice(1) : "/dashboard");
</script>
</body>
