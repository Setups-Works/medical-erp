<style>
/* Tokens mirror packages/ui/src/tokens/tokens.css (paper and ink). */
:root{--paper:#ffffff;--side:#f7f7f7;--raised:#ffffff;--sunken:#f0f0f0;--ink:#242424;--ink-2:#5c5c5c;--ink-3:#707070;--ink-4:#8f8f8f;
--line:#ebebeb;--line-2:#dedede;--line-3:#8f8f8f;--hover:rgba(36,36,36,.05);--press:rgba(36,36,36,.08);
--critical:#bc2a41;--success:#2d8659;--warning:#c2923a;--coral:#dd7b5e;--data:#2f7ab0;--violet:#7a5ea8;--slate:#6b7480;
--ease:cubic-bezier(.2,.7,.2,1);--sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--brand:"Instrument Serif",Georgia,serif}
html.dark{--paper:#191919;--side:#202020;--raised:#232323;--sunken:#2b2b2b;--ink:#ebebeb;--ink-2:#b3b3b3;--ink-3:#8a8a8a;--ink-4:#737373;
--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.13);--line-3:rgba(255,255,255,.34);--hover:rgba(255,255,255,.05);--press:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid color-mix(in srgb,var(--data) 55%,transparent);outline-offset:2px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s var(--ease)}
.app.rail{grid-template-columns:48px minmax(0,1fr)}

/* Sidebar */
aside{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-head{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-bottom:1px solid var(--line)}
.wordmark{font:28px/1 var(--brand);letter-spacing:-.01em} .wordmark small{font:500 11px var(--sans);color:var(--ink-4);margin-left:6px;letter-spacing:0}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)} .icon-btn:hover{background:var(--hover);color:var(--ink)}
.sb-head .icon-btn{margin-left:auto}
.company{margin:10px;padding:8px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--raised);display:flex;align-items:center;gap:10px;text-align:left;width:calc(100% - 20px)}
.company .logo{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 12px var(--sans);flex:none}
.company b{display:block;font-weight:600;font-size:13px;line-height:1.2} .company span{font-size:11.5px;color:var(--ink-3)}
.company svg{margin-left:auto;color:var(--ink-4)}
nav.menu{flex:1;overflow:auto;padding:4px 8px 16px;scrollbar-width:thin}
.grp{margin-top:2px}
.grp-btn{width:100%;height:34px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:6px;font-size:13.5px;color:var(--ink-2);text-align:left}
.grp-btn:hover{background:var(--hover);color:var(--ink)}
.grp-btn .chev{margin-left:auto;color:var(--ink-4);transition:transform .2s var(--ease);width:14px;height:14px}
.grp.open>.grp-btn .chev{transform:rotate(90deg)}
.grp.has-active>.grp-btn{color:var(--ink);font-weight:500}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--ease)} .grp.open>.sub{grid-template-rows:1fr}
.sub>div{overflow:hidden}
.sub ul{list-style:none;margin:2px 0 6px;padding:0 0 0 17px;border-left:1px solid var(--line-2);margin-left:16px}
.sub li a{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.sub li a:hover{background:var(--hover);color:var(--ink)}
.sub li a.active{background:var(--press);color:var(--ink);font-weight:500}
.sub li a kbd{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink-4)}
.sub .w{font:600 9.5px var(--mono);color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 40%,transparent);border-radius:4px;padding:0 4px}
.sec-h{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4);padding:10px 8px 4px}
.sb-foot{border-top:1px solid var(--line);padding:8px;display:flex;gap:4px;align-items:center}
.sb-foot .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px 6px;border-radius:6px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font:600 11.5px var(--sans);flex:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.who b{display:block;font-size:12.5px;font-weight:500;line-height:1.2} .who span{font-size:11px;color:var(--ink-3)}
/* Rail mode: icons only, submenus fly out on hover */
.app.rail .wordmark small,.app.rail .company,.app.rail .grp-btn .lbl,.app.rail .grp-btn .chev,.app.rail .who div{display:none} .app.rail .who{flex:none;padding:0}
.app.rail .sb-head{padding:0 8px;justify-content:center} .app.rail .wordmark{display:none} .app.rail .sb-head .icon-btn{margin:0}
.app.rail nav.menu{padding:8px 6px;overflow:visible} .app.rail .grp-btn{justify-content:center;padding:0}
.app.rail .sub{display:none}
.app.rail .grp{position:relative}
.app.rail .grp.fly>.sub{display:block;position:fixed;left:52px;top:var(--fly-top,60px);background:var(--raised);border-radius:10px;box-shadow:0 0 0 1px var(--line-2),0 12px 32px rgba(0,0,0,.14);padding:6px;z-index:30;min-width:240px;max-height:calc(100vh - var(--fly-top,60px) - 12px);overflow:auto}
.app.rail .grp.fly>.sub ul{border:0;margin:0;padding:0}
.app.rail .grp.fly>.sub::before{content:attr(data-title);display:block;font-weight:600;font-size:13px;padding:6px 8px 4px}
.app.rail .grp.fly>.grp-btn,.app.rail .grp.has-active>.grp-btn{background:var(--press);color:var(--ink)}
.app.rail .sb-foot{flex-direction:column}

/* Top bar */
header.top{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;gap:10px;padding:0 18px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.2);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:500} .crumb svg{width:13px;height:13px;color:var(--ink-4)}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;background:var(--side);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-4);font-size:13px;width:280px;white-space:nowrap;overflow:hidden}
.search kbd{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.pill-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill-btn:hover{background:var(--hover)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap} .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.bell{position:relative} .bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--paper)}
.mobile-menu{display:none}

/* Page */
main{min-width:0}
.page{max-width:1280px;margin:0 auto;padding:22px 22px 60px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:18px}
.ph h1{font:600 clamp(26px,3vw,32px)/1.1 var(--sans);letter-spacing:-.022em;margin:0}
.ph p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}
.ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)} .btn.primary:hover{opacity:.9}
.btn.outline{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--raised)} .btn.outline:hover{background:var(--hover)}
.btn kbd{font:500 10.5px var(--mono);opacity:.6}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.fp{height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2)} .fp:hover{background:var(--hover)}
.fp.on{background:var(--ink);color:var(--paper);box-shadow:none}
.card{background:var(--raised);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;min-width:0}
.card h3{margin:0;font-size:14px;font-weight:600} .card .h{display:flex;align-items:center;gap:8px;margin-bottom:12px} .card .h a{margin-left:auto;font-size:12.5px;color:var(--data);text-decoration:none}
.card .h .sub-t{font-size:12.5px;color:var(--ink-4)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi .l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)} .kpi .l svg{width:14px;height:14px}
.kpi .v{font:600 clamp(18px,1.7vw,24px)/1.2 var(--mono);white-space:nowrap;letter-spacing:-.02em;margin:8px 0 4px}
.kpi .d{font-size:12px;color:var(--ink-3)} .up{color:var(--success)} .down{color:var(--critical)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--side);color:var(--ink-3);font-weight:500;font-size:12.5px;text-align:left;padding:8px 10px;white-space:nowrap}
th:first-child{border-radius:6px 0 0 6px} th:last-child{border-radius:0 6px 6px 0}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap} tr:last-child td{border-bottom:0} tbody tr:hover td{background:var(--hover)}
.r{text-align:right} .c{text-align:center}
.tbl{overflow-x:auto}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font:500 11.5px var(--sans);white-space:nowrap}
.b-ok{color:var(--success);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--success) 35%,transparent)}
.b-warn{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent)}
.b-crit{color:var(--critical);background:color-mix(in srgb,var(--critical) 10%,transparent)}
.b-slate{color:var(--slate);background:color-mix(in srgb,var(--slate) 12%,transparent)}
.b-h{color:var(--data);background:color-mix(in srgb,var(--data) 12%,transparent)} .b-h1{color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.badge svg{width:12px;height:12px}
/* Chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px;border-bottom:1px solid var(--line-2)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;position:relative}
.pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;max-width:44px} .bar .s,.bar .p{flex:1;border-radius:3px 3px 0 0;min-height:2px} .bar .s{background:var(--ink);opacity:.85} .bar .p{background:var(--line-3);opacity:.55}
.bar:hover .s{opacity:1} .bar .tip{position:absolute;bottom:calc(100% + 4px);font:500 11px var(--mono);color:var(--ink-2);opacity:0;transition:opacity .14s;white-space:nowrap}
.bar:hover .tip{opacity:1}
.xl{display:flex;gap:10px;margin-top:6px} .xl span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-4)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3)} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.list{display:grid;gap:0} .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px} .row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0} .row .m b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .m span{font-size:12px;color:var(--ink-3)}
.meter{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:6px} .meter i{display:block;height:100%;background:var(--ink)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 12px;gap:2px} .split i{display:block;height:100%}
.placeholder{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--ink-3)} .placeholder svg{width:28px;height:28px;margin-bottom:8px;color:var(--ink-4)}
.placeholder h2{color:var(--ink);font-size:18px;margin:0 0 4px}
.note{font-size:12px;color:var(--ink-4);margin-top:16px;text-align:center}
.scrim{display:none}
@media (max-width:1100px){.c8,.c4,.c6{grid-column:span 12} .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

 .app.mob-open aside{transform:none} .app.mob-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
 .mobile-menu{display:grid} .sb-head .collapse{display:none} .pill-btn .lbl{display:none} .page{padding:16px 14px 40px} header.top{padding:0 10px}
}

let active = "/dashboard";
const openGroups = new Set(["Dashboard"]);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderMenu(){
  $("menu").innerHTML = NAV.map(g => {
    let sec = "", lis = "";
    for (const [label, route, kbd, w, section] of g.items) {
      if (section && section !== sec) { sec = section; lis += `<li class="sec-h">${section}</li>`; }
      lis += `<li><a href="#${route}" data-route="${route}" class="${route===active?"active":""}">${esc(label)}${w?' <span class="w" title="Wholesale edition only">W</span>':""}${kbd?`<kbd>${kbd}</kbd>`:""}</a></li>`;
    }
    const has = g.items.some(i => i[1]===active);
    return `<div class="grp ${openGroups.has(g.g)?"open":""} ${has?"has-active":""}" data-g="${esc(g.g)}">
      <button class="grp-btn" aria-expanded="${openGroups.has(g.g)}" title="${esc(g.g)}"><i data-lucide="${g.icon}"></i><span class="lbl">${esc(g.g)}</span><i data-lucide="chevron-right" class="chev"></i></button>
      <div class="sub" data-title="${esc(g.g)}"><div><ul>${lis}</ul></div></div></div>`;
  }).join("");
  lucide.createIcons();
}
$("menu").addEventListener("click", e => {
  const b = e.target.closest(".grp-btn");
  if (b && $("app").classList.contains("rail")) return;
  if (b) { const g = b.parentElement.dataset.g; openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g); renderMenu(); return; }
  const a = e.target.closest("a[data-route]");
  if (a) { e.preventDefault(); go(a.dataset.route); $("app").classList.remove("mob-open"); }
});

function findItem(route){ for (const g of NAV) for (const i of g.items) if (i[1]===route) return {g, i}; return null; }
function go(route){
  active = route; const f = findItem(route);
  if (f) openGroups.add(f.g.g);
  history.replaceState(null, "", "#" + route);
  $("crumb").innerHTML = f ? `<span>${esc(f.g.g)}</span>${f.i[4]?`<i data-lucide="chevron-right"></i><span>${f.i[4]}</span>`:""}<i data-lucide="chevron-right"></i><b>${esc(f.i[0])}</b>` : "";
  $("page").innerHTML = route === "/dashboard" ? dashboard() : placeholder(f);
  renderMenu(); window.scrollTo(0,0);
}

const money = n => "₹" + Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const short = n => n >= 1e7 ? "₹" + (n/1e7).toFixed(2) + " Cr" : n >= 1e5 ? "₹" + (n/1e5).toFixed(2) + " L" : money(n);

function kpi(icon,label,value,delta,good){ return `<div class="card kpi"><div class="l"><i data-lucide="${icon}"></i>${label}</div><div class="v">${value}</div><div class="d">${delta?`<span class="${good?"up":"down"}">${delta}</span> vs yesterday`:"&nbsp;"}</div></div>`; }

function placeholder(f){
  if (!f) return "";
  return `<div class="ph"><div><h1>${esc(f.i[0])}</h1><p class="mono">${f.i[1]}</p></div><div class="actions"><button class="btn primary" onclick="go('/dashboard')"><i data-lucide="layout-dashboard"></i>Back to dashboard</button></div></div>
  <div class="card placeholder"><div><i data-lucide="${f.g.icon}"></i><h2>${esc(f.i[0])} goes here</h2><p>This static demo only draws the home dashboard. The menu item, breadcrumb and route are real.${f.i[3]?" Shown only for wholesale-edition companies.":""}</p></div></div>`;
}

// Rail mode: show a group's items in a fly-out next to its icon.
let flyTimer;
$("menu").addEventListener("mouseover", e => {
  if (!$("app").classList.contains("rail")) return;
  const g = e.target.closest(".grp"); if (!g) return;
  clearTimeout(flyTimer);
  document.querySelectorAll(".grp.fly").forEach(x => x !== g && x.classList.remove("fly"));
  if (!g.classList.contains("fly")) { const r = g.querySelector(".grp-btn").getBoundingClientRect(); g.style.setProperty("--fly-top", Math.min(r.top, innerHeight - 200) + "px"); g.classList.add("fly"); }
});
$("menu").addEventListener("mouseleave", () => { flyTimer = setTimeout(() => document.querySelectorAll(".grp.fly").forEach(x => x.classList.remove("fly")), 250); });
$("collapse").onclick = () => { $("app").classList.toggle("rail"); };
$("mob").onclick = () => $("app").classList.add("mob-open");
$("scrim").onclick = () => $("app").classList.remove("mob-open");
$("theme").onclick = () => { document.documentElement.classList.toggle("dark"); };
addEventListener("keydown", e => { if (e.ctrlKey && e.key.toLowerCase()==="b") { e.preventDefault(); $("app").classList.toggle("rail"); } });
go(location.hash.slice(1) && findItem(location.hash.slice(1)) ? location.hash.slice(1) : "/dashboard");
</script>
</body>
</html>
