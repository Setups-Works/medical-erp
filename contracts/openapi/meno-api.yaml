openapi: 3.1.0
info:
  description: "MENO Pharmacy ERP backend. Errors are RFC 9457 Problem Details with\
    \ a stable `code` (MODULE_REASON). Sign in with POST /api/v1/auth/login, then\
    \ press Authorize and paste the accessToken."
  title: MENO API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Set-up steps from sign-up to go-live; resume anywhere.
  name: Onboarding
- description: Confirm the owner's email with the one-time link.
  name: Verification
- description: "Sign in, refresh, sign out. Errors are Problem Details with a `code`."
  name: Auth
- description: Create a pharmacy business (tenant) and its owner account.
  name: Sign-up
paths:
  /api/v1/auth/login:
    post:
      description: Returns a short-lived access token in the body and sets the meno_refresh
        HttpOnly cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Signed in
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request body
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_INVALID_CREDENTIALS (same for unknown email)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_ACCOUNT_DISABLED
        "423":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_LOCKED after too many wrong passwords
      security: []
      summary: Sign in with email and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the session behind the meno_refresh cookie and clears it.
      operationId: logout
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Signed out (also when already signed out)
      security: []
      summary: Sign out
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: "User, tenant and roles from the access token."
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Current user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Missing, expired or invalid access token"
      summary: Who am I
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: "Uses the meno_refresh cookie, rotates it and returns a new access\
        \ token."
      operationId: refresh
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens issued
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "AUTH_REFRESH_INVALID, or AUTH_REFRESH_REUSED (whole session\
            \ revoked)"
      security: []
      summary: Get a new access token
      tags:
      - Auth
  /api/v1/auth/signup:
    post:
      description: "Creates the tenant, its OWNER user and the terms/privacy consent\
        \ in one transaction, then signs the owner in. Send an Idempotency-Key (UUID):\
        \ repeating the request with the same key returns the same account instead\
        \ of a duplicate."
      operationId: signUp
      parameters:
      - description: Client-generated UUID; repeat it when retrying the same sign-up
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Replay of an earlier sign-up with the same Idempotency-Key
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Created and signed in (same body as login)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Field errors, IDENTITY_PASSWORD_TOO_SHORT, IDENTITY_START_OPTION_INVALID,\
            \ IDENTITY_TERMS_NOT_ACCEPTED, TENANCY_STATE_UNKNOWN, IDENTITY_SIGNUP_REJECTED"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_SIGNUP_CLOSED
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_EMAIL_TAKEN
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: COMMON_IDEMPOTENCY_MISMATCH (key used for another sign-up)
      security: []
      summary: Sign up a new pharmacy business
      tags:
      - Sign-up
  /api/v1/auth/signup/options:
    get:
      description: "States (GST codes), start options, the current terms version and\
        \ the password minimum. The screen never hard-codes these lists."
      operationId: options_1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
          description: Options
      security: []
      summary: Options for the sign-up screen
      tags:
      - Sign-up
  /api/v1/auth/verification:
    get:
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: Status
      summary: Verification status of the signed-in user
      tags:
      - Verification
  /api/v1/auth/verify-email:
    post:
      description: "Works without signing in (the link may be opened on another device).\
        \ Single use, 24 h."
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "204":
          description: Email confirmed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "IDENTITY_VERIFICATION_INVALID, IDENTITY_VERIFICATION_EXPIRED"
      security: []
      summary: Confirm an email with the token from the link
      tags:
      - Verification
  /api/v1/auth/verify-email/resend:
    post:
      description: Older links stop working.
      operationId: resend
      responses:
        "202":
          description: Sent
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_ALREADY_VERIFIED
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_VERIFICATION_TOO_SOON
      summary: Send a new verification link
      tags:
      - Verification
  /api/v1/onboarding:
    get:
      operationId: checklist
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
          description: OK
      summary: "Checklist: every step with its status and the next step to resume"
      tags:
      - Onboarding
  /api/v1/onboarding/books:
    get:
      operationId: books
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Books"
          description: Not filled in yet
      tags:
      - Onboarding
    put:
      description: The FY starts on day 1 of the configured month (April by default)
        and lasts a year.
      operationId: saveBooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Books"
          description: "TENANCY_FY_START_INVALID, TENANCY_BOOKS_START_OUTSIDE_FY"
      summary: Save the financial year and books start date
      tags:
      - Onboarding
  /api/v1/onboarding/branches:
    get:
      operationId: branches
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branches"
          description: OK
      summary: "Branches, plus a suggestion pre-filled from the company address when\
        \ there are none"
      tags:
      - Onboarding
    post:
      description: The first branch becomes the head office.
      operationId: createBranch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: TENANCY_BRANCH_STATE_MISMATCH
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: "TENANCY_BRANCH_CODE_TAKEN, TENANCY_STEP_ORDER"
      summary: Add a branch
      tags:
      - Onboarding
  /api/v1/onboarding/branches/{id}:
    get:
      operationId: branch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: TENANCY_BRANCH_NOT_FOUND (also for another tenant's id)
      tags:
      - Onboarding
    put:
      operationId: updateBranch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: OK
      tags:
      - Onboarding
  /api/v1/onboarding/business:
    get:
      operationId: business
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
          description: OK
      tags:
      - Onboarding
    put:
      description: Every value must be a code from /options.
      operationId: saveBusiness
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
          description: TENANCY_OPTION_INVALID
      summary: Save the business profile
      tags:
      - Onboarding
  /api/v1/onboarding/company:
    get:
      operationId: company
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Details"
          description: Not filled in yet
      tags:
      - Onboarding
    put:
      description: "GSTIN check character, state = GSTIN state, PAN = GSTIN chars\
        \ 3–12. GSTIN fetch (PTY-15) is a separate endpoint later."
      operationId: saveCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Details"
          description: "TENANCY_GSTIN_INVALID, TENANCY_GSTIN_STATE_MISMATCH, TENANCY_PAN_GSTIN_MISMATCH,\
            \ TENANCY_GSTIN_REQUIRED, TENANCY_GSTIN_NOT_ALLOWED, TENANCY_STATE_UNKNOWN"
      summary: Save company & GST
      tags:
      - Onboarding
  /api/v1/onboarding/configuration:
    get:
      operationId: configuration
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
      summary: Tenant settings with defaults filled in
      tags:
      - Onboarding
    put:
      description: Keys and allowed values from /options.
      operationId: saveConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: "TENANCY_SETTING_UNKNOWN, TENANCY_SETTING_INVALID"
      summary: Save billing / stock preferences
      tags:
      - Onboarding
  /api/v1/onboarding/go-live:
    get:
      operationId: readiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: OK
      summary: Readiness checks and the allowed go-live date range
      tags:
      - Onboarding
    post:
      description: All checks must pass; date between books start and today + N days.
      operationId: goLive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoLiveRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: TENANCY_GO_LIVE_DATE_INVALID
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: "TENANCY_NOT_READY, TENANCY_ALREADY_LIVE"
      summary: Go live
      tags:
      - Onboarding
  /api/v1/onboarding/licences:
    get:
      operationId: licences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licences"
          description: OK
      tags:
      - Onboarding
    put:
      description: Which drug licences are required depends on the business type (seeded
        rule table). Drug licences need an expiry in the future. Scans come with the
        files module.
      operationId: saveLicences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicencesRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licences"
          description: "TENANCY_LICENCE_REQUIRED, TENANCY_LICENCE_EXPIRY_REQUIRED,\
            \ TENANCY_LICENCE_EXPIRED, TENANCY_FSSAI_INVALID"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licences"
          description: TENANCY_STEP_ORDER (business profile and company first)
      summary: Save licences and the pharmacist in charge
      tags:
      - Onboarding
  /api/v1/onboarding/options:
    get:
      operationId: options
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
          description: OK
      summary: "Option lists, setting definitions and states for all onboarding screens"
      tags:
      - Onboarding
  /api/v1/onboarding/steps/{step}/skip:
    post:
      operationId: skip
      parameters:
      - in: path
        name: step
        required: true
        schema:
          type: string
      responses:
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
          description: "TENANCY_STEP_REQUIRED, TENANCY_ALREADY_LIVE"
      summary: "Skip an optional step (team, data, devices, plan, practice)"
      tags:
      - Onboarding
components:
  schemas:
    Books:
      type: object
      properties:
        booksStartDate:
          type: string
          format: date
        financialYearEnd:
          type: string
          format: date
        financialYearStart:
          type: string
          format: date
        label:
          type: string
    BooksRequest:
      type: object
      properties:
        booksStartDate:
          type: string
          format: date
        financialYearStart:
          type: string
          format: date
      required:
      - booksStartDate
      - financialYearStart
    BranchRequest:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        addressLine2:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        city:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        code:
          type: string
          minLength: 1
          pattern: "[A-Z0-9]{1,10}"
        district:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        name:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        pin:
          type: string
          minLength: 1
          pattern: "[1-9][0-9]{5}"
        stateCode:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
      required:
      - addressLine1
      - city
      - code
      - name
      - pin
      - stateCode
    BranchView:
      type: object
      properties:
        details:
          $ref: "#/components/schemas/Details"
        headOffice:
          type: boolean
        id:
          type: string
          format: uuid
    Branches:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchView"
        suggestion:
          $ref: "#/components/schemas/Details"
    BusinessProfile:
      type: object
      properties:
        branchCount:
          type: string
        businessType:
          type: string
        catalogueSize:
          type: string
        currentSoftware:
          type: string
        language:
          type: string
    BusinessRequest:
      type: object
      properties:
        branchCount:
          type: string
          maxLength: 50
          minLength: 0
        businessType:
          type: string
          maxLength: 50
          minLength: 0
        catalogueSize:
          type: string
          maxLength: 50
          minLength: 0
        currentSoftware:
          type: string
          maxLength: 50
          minLength: 0
        language:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - branchCount
      - businessType
      - catalogueSize
      - currentSoftware
      - language
    Check:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        passed:
          type: boolean
    Checklist:
      type: object
      properties:
        goLiveDate:
          type: string
          format: date
        live:
          type: boolean
        nextStep:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepStatus"
    CompanyRequest:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        addressLine2:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        city:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        district:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        gstin:
          type: string
          pattern: "|[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]"
        legalName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        pan:
          type: string
          minLength: 1
          pattern: "[A-Z]{5}[0-9]{4}[A-Z]"
        phone:
          type: string
          pattern: "|[6-9][0-9]{9}"
        pin:
          type: string
          minLength: 1
          pattern: "[1-9][0-9]{5}"
        registrationType:
          type: string
          maxLength: 50
          minLength: 0
        stateCode:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
        tradeName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
      required:
      - addressLine1
      - city
      - legalName
      - pan
      - pin
      - registrationType
      - stateCode
    ConfigurationRequest:
      type: object
      properties:
        settings:
          type: object
          additionalProperties:
            type: string
      required:
      - settings
    Details:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        district:
          type: string
        email:
          type: string
        gstin:
          type: string
        legalName:
          type: string
        pan:
          type: string
        phone:
          type: string
        pin:
          type: string
        registrationType:
          type: string
        stateCode:
          type: string
        tradeName:
          type: string
    GoLiveRequest:
      type: object
      properties:
        goLiveDate:
          type: string
          format: date
      required:
      - goLiveDate
    LicenceEntry:
      type: object
      properties:
        number:
          type: string
        validTo:
          type: string
          format: date
    LicenceRequest:
      type: object
      properties:
        number:
          type: string
          maxLength: 40
          minLength: 3
          pattern: "[^\\p{Cntrl}]*"
        validTo:
          type: string
          format: date
      required:
      - number
    Licences:
      type: object
      properties:
        licences:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LicenceEntry"
        pharmacistCouncilState:
          type: string
        pharmacistName:
          type: string
        pharmacistRegNo:
          type: string
        required:
          type: array
          items:
            type: string
            enum:
            - DRUG_RETAIL
            - DRUG_WHOLESALE
            - FSSAI
            - NARCOTIC
          uniqueItems: true
    LicencesRequest:
      type: object
      properties:
        drugRetail:
          $ref: "#/components/schemas/LicenceRequest"
        drugWholesale:
          $ref: "#/components/schemas/LicenceRequest"
        fssai:
          $ref: "#/components/schemas/LicenceRequest"
        narcotic:
          $ref: "#/components/schemas/LicenceRequest"
        pharmacistCouncilState:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
        pharmacistName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        pharmacistRegNo:
          type: string
          maxLength: 40
          minLength: 3
          pattern: "[^\\p{Cntrl}]*"
      required:
      - pharmacistCouncilState
      - pharmacistName
      - pharmacistRegNo
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    MeResponse:
      type: object
      properties:
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    Option:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
    Options:
      type: object
      properties:
        financialYearStartMonth:
          type: integer
          format: int32
        lists:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Option"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SettingInfo"
        states:
          type: array
          items:
            $ref: "#/components/schemas/StateInfo"
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Readiness:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
        earliestDate:
          type: string
          format: date
        goLiveDate:
          type: string
          format: date
        latestDate:
          type: string
          format: date
        live:
          type: boolean
        ready:
          type: boolean
    SettingInfo:
      type: object
      properties:
        defaultValue:
          type: string
        key:
          type: string
        listCode:
          type: string
        max:
          type: integer
          format: int32
        min:
          type: integer
          format: int32
        type:
          type: string
    SignupRequest:
      type: object
      properties:
        acceptedTermsVersion:
          type: string
          maxLength: 40
          minLength: 0
        businessName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        mobile:
          type: string
          minLength: 1
          pattern: "[6-9][0-9]{9}"
        ownerName:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        partnerCode:
          type: string
          maxLength: 40
          minLength: 0
          pattern: "[A-Za-z0-9-]*"
        password:
          type: string
          maxLength: 128
          minLength: 0
        startWith:
          type: string
          maxLength: 40
          minLength: 0
        stateCode:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
        website:
          type: string
          description: Leave empty (bot trap)
      required:
      - acceptedTermsVersion
      - businessName
      - email
      - mobile
      - ownerName
      - password
      - startWith
      - stateCode
    StateInfo:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    Status:
      type: object
      properties:
        emailVerified:
          type: boolean
        mobileVerified:
          type: boolean
    StepStatus:
      type: object
      properties:
        available:
          type: boolean
        code:
          type: string
        phase:
          type: string
        required:
          type: boolean
        route:
          type: string
        status:
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/UserView"
    UserView:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        tenantId:
          type: string
          format: uuid
    VerifyRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - token
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token from /api/v1/auth/login or /api/v1/auth/refresh
      scheme: bearer
      type: http
