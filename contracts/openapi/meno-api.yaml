openapi: 3.1.0
info:
  description: "MENO Pharmacy ERP backend. Errors are RFC 9457 Problem Details with\
    \ a stable `code` (MODULE_REASON). Sign in with POST /api/v1/auth/login, then\
    \ press Authorize and paste the accessToken."
  title: MENO API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: "MENO's default roles and your own: names, permissions, reset, archive."
  name: Roles
- description: Set-up steps from sign-up to go-live; resume anywhere.
  name: Onboarding
- description: "What each role may do, permission by permission."
  name: Permissions
- description: "Sign in, refresh, sign out. Errors are Problem Details with a `code`."
  name: Auth
- description: Create a pharmacy business (tenant) and its owner account.
  name: Sign-up
- description: Invite staff with a role and branches; resend or revoke open invitations.
  name: Team
- description: "Staff accounts: roles, branch access, deactivate and reactivate."
  name: Users
- description: Forgot and reset password with a single-use emailed link.
  name: Password
- description: Confirm the owner's email (one-time link) and mobile (SMS code).
  name: Verification
- description: Verify a GSTIN and fetch its registration details.
  name: GSTIN
paths:
  /api/v1/admin/permissions:
    get:
      operationId: permissionCatalogue
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCatalogue"
          description: OK
      summary: "Every permission by module, with the roles that hold it for your business"
      tags:
      - Permissions
  /api/v1/admin/permissions/{permission}/roles/{role}:
    delete:
      description: Idempotent.
      operationId: revokePermission
      parameters:
      - in: path
        name: permission
        required: true
        schema:
          type: string
      - in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"
          description: The permission with the roles that hold it now
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"
          description: "IDENTITY_PERMISSION_NOT_FOUND, IDENTITY_ROLE_NOT_FOUND"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"
          description: "IDENTITY_ROLE_LOCKED, IDENTITY_LAST_ADMIN"
      summary: Take this permission from a role
      tags:
      - Permissions
    put:
      description: Idempotent. For a default role this makes your own copy of its
        list (reset it on the role page).
      operationId: grantPermission
      parameters:
      - in: path
        name: permission
        required: true
        schema:
          type: string
      - in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"
          description: The permission with the roles that hold it now
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"
          description: "IDENTITY_PERMISSION_NOT_FOUND, IDENTITY_ROLE_NOT_FOUND (also\
            \ another tenant's role)"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEntry"
          description: IDENTITY_ROLE_LOCKED
      summary: Give a role this permission
      tags:
      - Permissions
  /api/v1/admin/roles:
    get:
      operationId: listRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleSummary"
          description: OK
      summary: "Roles: defaults first, then your own, with how many people hold each"
      tags:
      - Roles
    post:
      description: "Empty, or starting with another role's permissions."
      operationId: createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: Created
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: IDENTITY_ROLE_NOT_FOUND (copyFrom)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: IDENTITY_ROLE_NAME_TAKEN
      summary: Create your own role
      tags:
      - Roles
  /api/v1/admin/roles/{code}:
    delete:
      description: "Archived, so old records keep its name. Refused while active people\
        \ hold it or open invitations carry it."
      operationId: archiveRole
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Archived
        "404":
          description: IDENTITY_ROLE_NOT_FOUND
        "409":
          description: "IDENTITY_ROLE_NOT_EDITABLE (default role), IDENTITY_ROLE_IN_USE"
      summary: Remove your own role
      tags:
      - Roles
    get:
      operationId: getRole
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: The role
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: IDENTITY_ROLE_NOT_FOUND (also another tenant's role)
      summary: One role with its permissions
      tags:
      - Roles
    put:
      operationId: renameRole
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: Saved
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: IDENTITY_ROLE_NOT_FOUND
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: "IDENTITY_ROLE_NOT_EDITABLE (default role), IDENTITY_ROLE_NAME_TAKEN,\
            \ COMMON_VERSION_CONFLICT"
      summary: Rename your own role
      tags:
      - Roles
  /api/v1/admin/roles/{code}/permissions:
    put:
      description: For a default role this makes your own copy of its list; reset
        brings MENO's back.
      operationId: setRolePermissions
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: Saved; applies within 30 seconds
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: "IDENTITY_PERMISSION_INVALID, field errors"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: IDENTITY_ROLE_NOT_FOUND
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: "IDENTITY_ROLE_LOCKED, IDENTITY_LAST_ADMIN, COMMON_VERSION_CONFLICT"
      summary: Set the role's permissions (whole list)
      tags:
      - Roles
  /api/v1/admin/roles/{code}/reset:
    post:
      operationId: resetRole
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: Reset
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: IDENTITY_ROLE_NOT_FOUND
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
          description: "IDENTITY_ROLE_LOCKED, IDENTITY_ROLE_NOT_EDITABLE (own role),\
            \ IDENTITY_LAST_ADMIN"
      summary: Give a default role MENO's permissions back
      tags:
      - Roles
  /api/v1/admin/users:
    get:
      description: "Branch-limited managers see people who share one of their branches,\
        \ and the owner."
      operationId: listUsers
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - in: query
        name: status
        required: false
        schema:
          type: string
          default: ACTIVE
          enum:
          - ACTIVE
          - DISABLED
          - ALL
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserPage"
          description: OK
      summary: "Staff accounts you can see, by name (page envelope)"
      tags:
      - Users
  /api/v1/admin/users/options:
    get:
      operationId: userOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAdminOptions"
          description: OK
      summary: Roles (with whether they can be changed here) and the branches you
        can give access to
      tags:
      - Users
  /api/v1/admin/users/{id}:
    get:
      operationId: getUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: The account
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: IDENTITY_USER_NOT_FOUND (also another tenant's id)
      summary: One staff account
      tags:
      - Users
  /api/v1/admin/users/{id}/access:
    put:
      description: Whole sets. Branches are needed unless a role covers every branch.
        Roles that aren't assignable can't be added or removed. Send the version you
        loaded.
      operationId: changeUserAccess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccessRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: Saved; takes effect when the person's session refreshes
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: "IDENTITY_ROLE_INVALID, IDENTITY_ROLE_REQUIRED, IDENTITY_USER_BRANCH_INVALID,\
            \ field errors"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: IDENTITY_USER_NOT_FOUND (also another tenant's id)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: "COMMON_VERSION_CONFLICT, IDENTITY_LAST_ADMIN"
      summary: Change roles and branches
      tags:
      - Users
  /api/v1/admin/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: Deactivated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: IDENTITY_USER_NOT_FOUND (also another tenant's id)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: "IDENTITY_CANNOT_DEACTIVATE_SELF, IDENTITY_LAST_ADMIN, IDENTITY_USER_ALREADY_INACTIVE"
      summary: "Deactivate: the person can't sign in; their history stays"
      tags:
      - Users
  /api/v1/admin/users/{id}/reactivate:
    post:
      operationId: reactivateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: Active again
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: IDENTITY_USER_NOT_FOUND (also another tenant's id)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
          description: IDENTITY_USER_ALREADY_ACTIVE
      summary: Reactivate a deactivated account (also clears a password lockout)
      tags:
      - Users
  /api/v1/auth/login:
    post:
      description: "identifier is the email or the Indian mobile (10 digits, +91 optional).\
        \ Returns a short-lived access token in the body and sets the meno_refresh\
        \ HttpOnly cookie."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Signed in
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request body
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_INVALID_CREDENTIALS (same for unknown email or mobile)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_ACCOUNT_DISABLED
        "423":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_LOCKED after too many wrong passwords
      security: []
      summary: Sign in with email or mobile and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the session behind the meno_refresh cookie and clears it.
      operationId: logout
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Signed out (also when already signed out)
      security: []
      summary: Sign out
      tags:
      - Auth
  /api/v1/auth/logout-all:
    post:
      description: Revokes every session of the signed-in user (all browsers and devices)
        and clears the meno_refresh cookie. Access tokens already issued stop working
        when they expire (15 min).
      operationId: logoutAll
      responses:
        "204":
          description: Signed out everywhere
        "401":
          description: "Missing, expired or invalid access token"
      summary: Sign out of all devices
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: "User, tenant and roles from the access token, and the permissions\
        \ those roles carry (the UI shows only what the person may do; the API still\
        \ checks)."
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Current user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Missing, expired or invalid access token"
      summary: Who am I
      tags:
      - Auth
  /api/v1/auth/password/forgot:
    post:
      description: "Always 202, so it never reveals whether the email exists."
      operationId: forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "202":
          description: Accepted
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: COMMON_RATE_LIMITED
      security: []
      summary: Email a single-use reset link (AUT-01)
      tags:
      - Password
  /api/v1/auth/password/reset:
    post:
      description: Revokes all sessions. The minimum length comes from GET /auth/signup/options.
      operationId: reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_PASSWORD_TOO_SHORT
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_RESET_TOKEN_INVALID (expired or already used)
      security: []
      summary: Set a new password with the token from the email link
      tags:
      - Password
  /api/v1/auth/refresh:
    post:
      description: "Uses the meno_refresh cookie, rotates it and returns a new access\
        \ token."
      operationId: refresh
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens issued
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "AUTH_REFRESH_INVALID, or AUTH_REFRESH_REUSED (whole session\
            \ revoked)"
      security: []
      summary: Get a new access token
      tags:
      - Auth
  /api/v1/auth/signup:
    post:
      description: "Creates the tenant, its OWNER user and the terms/privacy consent\
        \ in one transaction, then signs the owner in. Send an Idempotency-Key (UUID):\
        \ repeating the request with the same key returns the same account instead\
        \ of a duplicate."
      operationId: signUp
      parameters:
      - description: Client-generated UUID; repeat it when retrying the same sign-up
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Replay of an earlier sign-up with the same Idempotency-Key
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Created and signed in (same body as login)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Field errors, IDENTITY_PASSWORD_TOO_SHORT, IDENTITY_START_OPTION_INVALID,\
            \ IDENTITY_TERMS_NOT_ACCEPTED, TENANCY_STATE_UNKNOWN, IDENTITY_SIGNUP_REJECTED"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_SIGNUP_CLOSED
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "IDENTITY_EMAIL_TAKEN, IDENTITY_MOBILE_TAKEN"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: COMMON_IDEMPOTENCY_MISMATCH (key used for another sign-up)
      security: []
      summary: Sign up a new pharmacy business
      tags:
      - Sign-up
  /api/v1/auth/signup/options:
    get:
      description: "States (GST codes), start options, the current terms version and\
        \ the password minimum. The screen never hard-codes these lists."
      operationId: options_1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
          description: Options
      security: []
      summary: Options for the sign-up screen
      tags:
      - Sign-up
  /api/v1/auth/verification:
    get:
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: Status
      summary: Verification status of the signed-in user
      tags:
      - Verification
  /api/v1/auth/verify-email:
    post:
      description: "Works without signing in (the link may be opened on another device).\
        \ Single use, 24 h."
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "204":
          description: Email confirmed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "IDENTITY_VERIFICATION_INVALID, IDENTITY_VERIFICATION_EXPIRED"
      security: []
      summary: Confirm an email with the token from the link
      tags:
      - Verification
  /api/v1/auth/verify-email/resend:
    post:
      description: Older links stop working.
      operationId: resend
      responses:
        "202":
          description: Sent
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_ALREADY_VERIFIED
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_VERIFICATION_TOO_SOON
      summary: Send a new verification link
      tags:
      - Verification
  /api/v1/auth/verify-mobile:
    post:
      description: 3 tries per code; then ask for a new code.
      operationId: verifyMobile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyMobileRequest"
        required: true
      responses:
        "204":
          description: Mobile verified
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "IDENTITY_VERIFICATION_INVALID (property attemptsLeft), IDENTITY_VERIFICATION_EXPIRED"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_ALREADY_VERIFIED
        "423":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_VERIFICATION_LOCKED after 3 wrong codes; send a new
            code
      summary: Confirm the SMS code
      tags:
      - Verification
  /api/v1/auth/verify-mobile/send:
    post:
      description: To the mobile the user signed up with. Works for 5 minutes; resend
        after 30 s; older codes stop working.
      operationId: sendMobileOtp
      responses:
        "202":
          description: Sent
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_ALREADY_VERIFIED
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_VERIFICATION_TOO_SOON
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: NOTIFICATION_CHANNEL_DISABLED (no SMS provider configured)
      summary: Send the 6-digit SMS code
      tags:
      - Verification
  /api/v1/gstin-verifications/{gstin}:
    get:
      description: "Format, state, PAN and check character are checked first; only\
        \ a valid GSTIN is sent to the provider. If the provider is down, enter the\
        \ details by hand: saving never depends on it."
      operationId: verify_1
      parameters:
      - in: path
        name: gstin
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GstinView"
          description: Details from the GST provider
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: COMMON_PERMISSION_DENIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: PARTY_GSTIN_NOT_FOUND
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "PARTY_GSTIN_INVALID (property failedCheck: FORMAT, STATE,\
            \ PAN, CHECK_CHARACTER)"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: PARTY_GSTIN_RATE_LIMITED
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: PARTY_GSTIN_SERVICE_UNAVAILABLE (also when no provider is set)
      summary: Verify a GSTIN and fetch its details
      tags:
      - GSTIN
  /api/v1/onboarding:
    get:
      operationId: checklist
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
          description: OK
      summary: "Checklist: every step with its status and the next step to resume"
      tags:
      - Onboarding
  /api/v1/onboarding/books:
    get:
      operationId: books
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Books"
          description: Not filled in yet
      tags:
      - Onboarding
    put:
      description: The FY starts on day 1 of the configured month (April by default)
        and lasts a year.
      operationId: saveBooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Books"
          description: "TENANCY_FY_START_INVALID, TENANCY_BOOKS_START_OUTSIDE_FY"
      summary: Save the financial year and books start date
      tags:
      - Onboarding
  /api/v1/onboarding/branches:
    get:
      operationId: branches
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branches"
          description: OK
      summary: "Branches, plus a suggestion pre-filled from the company address when\
        \ there are none"
      tags:
      - Onboarding
    post:
      description: The first branch becomes the head office.
      operationId: createBranch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: TENANCY_BRANCH_STATE_MISMATCH
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: "TENANCY_BRANCH_CODE_TAKEN, TENANCY_STEP_ORDER"
      summary: Add a branch
      tags:
      - Onboarding
  /api/v1/onboarding/branches/{id}:
    get:
      operationId: branch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: TENANCY_BRANCH_NOT_FOUND (also for another tenant's id)
      tags:
      - Onboarding
    put:
      operationId: updateBranch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchView"
          description: OK
      tags:
      - Onboarding
  /api/v1/onboarding/business:
    get:
      operationId: business
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
          description: OK
      tags:
      - Onboarding
    put:
      description: Every value must be a code from /options.
      operationId: saveBusiness
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
          description: TENANCY_OPTION_INVALID
      summary: Save the business profile
      tags:
      - Onboarding
  /api/v1/onboarding/company:
    get:
      operationId: company
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Details"
          description: Not filled in yet
      tags:
      - Onboarding
    put:
      description: "GSTIN check character, state = GSTIN state, PAN = GSTIN chars\
        \ 3–12. GSTIN fetch (PTY-15) is a separate endpoint later."
      operationId: saveCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Details"
          description: "TENANCY_GSTIN_INVALID, TENANCY_GSTIN_STATE_MISMATCH, TENANCY_PAN_GSTIN_MISMATCH,\
            \ TENANCY_GSTIN_REQUIRED, TENANCY_GSTIN_NOT_ALLOWED, TENANCY_STATE_UNKNOWN"
      summary: Save company & GST
      tags:
      - Onboarding
  /api/v1/onboarding/configuration:
    get:
      operationId: configuration
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
      summary: Tenant settings with defaults filled in
      tags:
      - Onboarding
    put:
      description: Keys and allowed values from /options.
      operationId: saveConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: "TENANCY_SETTING_UNKNOWN, TENANCY_SETTING_INVALID"
      summary: Save billing / stock preferences
      tags:
      - Onboarding
  /api/v1/onboarding/go-live:
    get:
      operationId: readiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: OK
      summary: Readiness checks and the allowed go-live date range
      tags:
      - Onboarding
    post:
      description: All checks must pass; date between books start and today + N days.
      operationId: goLive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoLiveRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: TENANCY_GO_LIVE_DATE_INVALID
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: "TENANCY_NOT_READY, TENANCY_ALREADY_LIVE"
      summary: Go live
      tags:
      - Onboarding
  /api/v1/onboarding/licences:
    get:
      operationId: licences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licences"
          description: OK
      tags:
      - Onboarding
    put:
      description: Which drug licences are required depends on the business type (seeded
        rule table). Drug licences need an expiry in the future. Scans come with the
        files module.
      operationId: saveLicences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicencesRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licences"
          description: "TENANCY_LICENCE_REQUIRED, TENANCY_LICENCE_EXPIRY_REQUIRED,\
            \ TENANCY_LICENCE_EXPIRED, TENANCY_FSSAI_INVALID"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licences"
          description: TENANCY_STEP_ORDER (business profile and company first)
      summary: Save licences and the pharmacist in charge
      tags:
      - Onboarding
  /api/v1/onboarding/options:
    get:
      operationId: options
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
          description: OK
      summary: "Option lists, setting definitions and states for all onboarding screens"
      tags:
      - Onboarding
  /api/v1/onboarding/steps/{step}/skip:
    post:
      operationId: skip
      parameters:
      - in: path
        name: step
        required: true
        schema:
          type: string
      responses:
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
          description: "TENANCY_STEP_REQUIRED, TENANCY_ALREADY_LIVE"
      summary: "Skip an optional step (team, data, devices, plan, practice)"
      tags:
      - Onboarding
  /api/v1/team/invitations:
    get:
      operationId: listInvitations
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitationPage"
          description: OK
      summary: "Invitations, newest first (page envelope)"
      tags:
      - Team
    post:
      description: "Email or mobile (or both), an invitable role and at least one\
        \ branch. The link is sent after the invitation is saved; it works for the\
        \ configured number of days."
      operationId: inviteStaff
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInvitationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: Created and sent
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: "IDENTITY_INVITATION_CONTACT_REQUIRED, IDENTITY_ROLE_INVALID,\
            \ IDENTITY_INVITATION_BRANCH_INVALID, field errors"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: "IDENTITY_EMAIL_TAKEN, IDENTITY_MOBILE_TAKEN, IDENTITY_INVITATION_PENDING"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: "NOTIFICATION_CHANNEL_DISABLED (mobile only, no SMS provider)"
      summary: Invite a person
      tags:
      - Team
  /api/v1/team/invitations/{id}/resend:
    post:
      operationId: resendInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: Sent again
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: IDENTITY_INVITATION_NOT_FOUND (also another tenant's id)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: IDENTITY_INVITATION_NOT_PENDING
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: IDENTITY_INVITATION_TOO_SOON
      summary: Send the invitation again with a new link (the old link stops working)
      tags:
      - Team
  /api/v1/team/invitations/{id}/revoke:
    post:
      operationId: revokeInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: Revoked
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: IDENTITY_INVITATION_NOT_FOUND (also another tenant's id)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
          description: IDENTITY_INVITATION_NOT_PENDING
      summary: Revoke an open invitation (its link stops working; the record stays
        for audit)
      tags:
      - Team
  /api/v1/team/options:
    get:
      operationId: teamOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOptions"
          description: OK
      summary: "Roles that can be invited, the tenant's branches, and whether SMS\
        \ delivery is set up"
      tags:
      - Team
components:
  schemas:
    Address:
      type: object
      properties:
        city:
          type: string
        line1:
          type: string
        line2:
          type: string
        pin:
          type: string
    Books:
      type: object
      properties:
        booksStartDate:
          type: string
          format: date
        financialYearEnd:
          type: string
          format: date
        financialYearStart:
          type: string
          format: date
        label:
          type: string
    BooksRequest:
      type: object
      properties:
        booksStartDate:
          type: string
          format: date
        financialYearStart:
          type: string
          format: date
      required:
      - booksStartDate
      - financialYearStart
    BranchOption:
      type: object
      properties:
        code:
          type: string
        headOffice:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
    BranchRequest:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        addressLine2:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        city:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        code:
          type: string
          minLength: 1
          pattern: "[A-Z0-9]{1,10}"
        district:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        name:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        pin:
          type: string
          minLength: 1
          pattern: "[1-9][0-9]{5}"
        stateCode:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
      required:
      - addressLine1
      - city
      - code
      - name
      - pin
      - stateCode
    BranchView:
      type: object
      properties:
        details:
          $ref: "#/components/schemas/Details"
        headOffice:
          type: boolean
        id:
          type: string
          format: uuid
    Branches:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchView"
        suggestion:
          $ref: "#/components/schemas/Details"
    BusinessProfile:
      type: object
      properties:
        branchCount:
          type: string
        businessType:
          type: string
        catalogueSize:
          type: string
        currentSoftware:
          type: string
        language:
          type: string
    BusinessRequest:
      type: object
      properties:
        branchCount:
          type: string
          maxLength: 50
          minLength: 0
        businessType:
          type: string
          maxLength: 50
          minLength: 0
        catalogueSize:
          type: string
          maxLength: 50
          minLength: 0
        currentSoftware:
          type: string
          maxLength: 50
          minLength: 0
        language:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - branchCount
      - businessType
      - catalogueSize
      - currentSoftware
      - language
    Check:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        passed:
          type: boolean
    Checklist:
      type: object
      properties:
        goLiveDate:
          type: string
          format: date
        live:
          type: boolean
        nextStep:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepStatus"
    CompanyRequest:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        addressLine2:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        city:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        district:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        gstin:
          type: string
          pattern: "|[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]"
        legalName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        pan:
          type: string
          minLength: 1
          pattern: "[A-Z]{5}[0-9]{4}[A-Z]"
        phone:
          type: string
          pattern: "|[6-9][0-9]{9}"
        pin:
          type: string
          minLength: 1
          pattern: "[1-9][0-9]{5}"
        registrationType:
          type: string
          maxLength: 50
          minLength: 0
        stateCode:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
        tradeName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
      required:
      - addressLine1
      - city
      - legalName
      - pan
      - pin
      - registrationType
      - stateCode
    ConfigurationRequest:
      type: object
      properties:
        settings:
          type: object
          additionalProperties:
            type: string
      required:
      - settings
    Details:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        district:
          type: string
        email:
          type: string
        gstin:
          type: string
        legalName:
          type: string
        pan:
          type: string
        phone:
          type: string
        pin:
          type: string
        registrationType:
          type: string
        stateCode:
          type: string
        tradeName:
          type: string
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    GoLiveRequest:
      type: object
      properties:
        goLiveDate:
          type: string
          format: date
      required:
      - goLiveDate
    GstinView:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/Address"
        cancelledOn:
          type: string
          format: date
        constitution:
          type: string
        eInvoiceEnabled:
          type: boolean
        fetchedAt:
          type: string
          format: date-time
        gstin:
          type: string
        legalName:
          type: string
        natureOfBusiness:
          type: array
          items:
            type: string
        pan:
          type: string
        registeredOn:
          type: string
          format: date
        registrationType:
          type: string
        source:
          type: string
        stateCode:
          type: string
        status:
          type: string
        tradeName:
          type: string
    LicenceEntry:
      type: object
      properties:
        number:
          type: string
        validTo:
          type: string
          format: date
    LicenceRequest:
      type: object
      properties:
        number:
          type: string
          maxLength: 40
          minLength: 3
          pattern: "[^\\p{Cntrl}]*"
        validTo:
          type: string
          format: date
      required:
      - number
    Licences:
      type: object
      properties:
        licences:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LicenceEntry"
        pharmacistCouncilState:
          type: string
        pharmacistName:
          type: string
        pharmacistRegNo:
          type: string
        required:
          type: array
          items:
            type: string
            enum:
            - DRUG_RETAIL
            - DRUG_WHOLESALE
            - FSSAI
            - NARCOTIC
          uniqueItems: true
    LicencesRequest:
      type: object
      properties:
        drugRetail:
          $ref: "#/components/schemas/LicenceRequest"
        drugWholesale:
          $ref: "#/components/schemas/LicenceRequest"
        fssai:
          $ref: "#/components/schemas/LicenceRequest"
        narcotic:
          $ref: "#/components/schemas/LicenceRequest"
        pharmacistCouncilState:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
        pharmacistName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        pharmacistRegNo:
          type: string
          maxLength: 40
          minLength: 3
          pattern: "[^\\p{Cntrl}]*"
      required:
      - pharmacistCouncilState
      - pharmacistName
      - pharmacistRegNo
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          example: owner@example.com or 9876543210
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - identifier
      - password
    MeResponse:
      type: object
      properties:
        email:
          type: string
        permissions:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    NewRoleRequest:
      type: object
      properties:
        copyFrom:
          type: string
          maxLength: 50
          minLength: 0
        description:
          type: string
          maxLength: 300
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        label:
          type: string
          maxLength: 60
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
      required:
      - label
    Option:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
    Options:
      type: object
      properties:
        financialYearStartMonth:
          type: integer
          format: int32
        lists:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Option"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SettingInfo"
        states:
          type: array
          items:
            $ref: "#/components/schemas/StateInfo"
    PermissionCatalogue:
      type: object
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/PermissionModule"
        roles:
