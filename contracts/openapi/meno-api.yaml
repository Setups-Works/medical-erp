openapi: 3.1.0
info:
  description: "MENO Pharmacy ERP backend. Errors are RFC 9457 Problem Details with\
    \ a stable `code` (MODULE_REASON). Sign in with POST /api/v1/auth/login, then\
    \ press Authorize and paste the accessToken."
  title: MENO API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Confirm the owner's email with the one-time link.
  name: Verification
- description: "Sign in, refresh, sign out. Errors are Problem Details with a `code`."
  name: Auth
- description: Create a pharmacy business (tenant) and its owner account.
  name: Sign-up
paths:
  /api/v1/auth/login:
    post:
      description: Returns a short-lived access token in the body and sets the meno_refresh
        HttpOnly cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Signed in
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request body
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_INVALID_CREDENTIALS (same for unknown email)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_ACCOUNT_DISABLED
        "423":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_LOCKED after too many wrong passwords
      security: []
      summary: Sign in with email and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the session behind the meno_refresh cookie and clears it.
      operationId: logout
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Signed out (also when already signed out)
      security: []
      summary: Sign out
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: "User, tenant and roles from the access token."
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Current user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Missing, expired or invalid access token"
      summary: Who am I
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: "Uses the meno_refresh cookie, rotates it and returns a new access\
        \ token."
      operationId: refresh
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens issued
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "AUTH_REFRESH_INVALID, or AUTH_REFRESH_REUSED (whole session\
            \ revoked)"
      security: []
      summary: Get a new access token
      tags:
      - Auth
  /api/v1/auth/signup:
    post:
      description: "Creates the tenant, its OWNER user and the terms/privacy consent\
        \ in one transaction, then signs the owner in. Send an Idempotency-Key (UUID):\
        \ repeating the request with the same key returns the same account instead\
        \ of a duplicate."
      operationId: signUp
      parameters:
      - description: Client-generated UUID; repeat it when retrying the same sign-up
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Replay of an earlier sign-up with the same Idempotency-Key
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Created and signed in (same body as login)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Field errors, IDENTITY_PASSWORD_TOO_SHORT, IDENTITY_START_OPTION_INVALID,\
            \ IDENTITY_TERMS_NOT_ACCEPTED, TENANCY_STATE_UNKNOWN, IDENTITY_SIGNUP_REJECTED"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_SIGNUP_CLOSED
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_EMAIL_TAKEN
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: COMMON_IDEMPOTENCY_MISMATCH (key used for another sign-up)
      security: []
      summary: Sign up a new pharmacy business
      tags:
      - Sign-up
  /api/v1/auth/signup/options:
    get:
      description: "States (GST codes), start options, the current terms version and\
        \ the password minimum. The screen never hard-codes these lists."
      operationId: options
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
          description: Options
      security: []
      summary: Options for the sign-up screen
      tags:
      - Sign-up
  /api/v1/auth/verification:
    get:
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: Status
      summary: Verification status of the signed-in user
      tags:
      - Verification
  /api/v1/auth/verify-email:
    post:
      description: "Works without signing in (the link may be opened on another device).\
        \ Single use, 24 h."
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "204":
          description: Email confirmed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "IDENTITY_VERIFICATION_INVALID, IDENTITY_VERIFICATION_EXPIRED"
      security: []
      summary: Confirm an email with the token from the link
      tags:
      - Verification
  /api/v1/auth/verify-email/resend:
    post:
      description: Older links stop working.
      operationId: resend
      responses:
        "202":
          description: Sent
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_ALREADY_VERIFIED
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: IDENTITY_VERIFICATION_TOO_SOON
      summary: Send a new verification link
      tags:
      - Verification
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    MeResponse:
      type: object
      properties:
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    Options:
      type: object
      properties:
        minPasswordLength:
          type: integer
          format: int32
        open:
          type: boolean
        startOptions:
          type: array
          items:
            type: string
        states:
          type: array
          items:
            $ref: "#/components/schemas/StateOption"
        termsVersion:
          type: string
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    SignupRequest:
      type: object
      properties:
        acceptedTermsVersion:
          type: string
          maxLength: 40
          minLength: 0
        businessName:
          type: string
          maxLength: 200
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        mobile:
          type: string
          minLength: 1
          pattern: "[6-9][0-9]{9}"
        ownerName:
          type: string
          maxLength: 100
          minLength: 0
          pattern: "[^\\p{Cntrl}]*"
        partnerCode:
          type: string
          maxLength: 40
          minLength: 0
          pattern: "[A-Za-z0-9-]*"
        password:
          type: string
          maxLength: 128
          minLength: 0
        startWith:
          type: string
          maxLength: 40
          minLength: 0
        stateCode:
          type: string
          minLength: 1
          pattern: "[0-9]{2}"
        website:
          type: string
          description: Leave empty (bot trap)
      required:
      - acceptedTermsVersion
      - businessName
      - email
      - mobile
      - ownerName
      - password
      - startWith
      - stateCode
    StateOption:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
        name:
          type: string
    Status:
      type: object
      properties:
        emailVerified:
          type: boolean
        mobileVerified:
          type: boolean
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/UserView"
    UserView:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        tenantId:
          type: string
          format: uuid
    VerifyRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - token
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token from /api/v1/auth/login or /api/v1/auth/refresh
      scheme: bearer
      type: http
