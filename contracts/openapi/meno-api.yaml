openapi: 3.1.0
info:
  description: "MENO Pharmacy ERP backend. Errors are RFC 9457 Problem Details with\
    \ a stable `code` (MODULE_REASON). Sign in with POST /api/v1/auth/login, then\
    \ press Authorize and paste the accessToken."
  title: MENO API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: "Sign in, refresh, sign out. Errors are Problem Details with a `code`."
  name: Auth
paths:
  /api/v1/auth/login:
    post:
      description: Returns a short-lived access token in the body and sets the meno_refresh
        HttpOnly cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Signed in
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid request body
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_INVALID_CREDENTIALS (same for unknown email)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_ACCOUNT_DISABLED
        "423":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: AUTH_LOCKED after too many wrong passwords
      security: []
      summary: Sign in with email and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the session behind the meno_refresh cookie and clears it.
      operationId: logout
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Signed out (also when already signed out)
      security: []
      summary: Sign out
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: "User, tenant and roles from the access token."
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: Current user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "Missing, expired or invalid access token"
      summary: Who am I
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: "Uses the meno_refresh cookie, rotates it and returns a new access\
        \ token."
      operationId: refresh
      parameters:
      - in: cookie
        name: meno_refresh
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: New tokens issued
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "AUTH_REFRESH_INVALID, or AUTH_REFRESH_REUSED (whole session\
            \ revoked)"
      security: []
      summary: Get a new access token
      tags:
      - Auth
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    MeResponse:
      type: object
      properties:
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/UserView"
    UserView:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        tenantId:
          type: string
          format: uuid
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token from /api/v1/auth/login or /api/v1/auth/refresh
      scheme: bearer
      type: http
