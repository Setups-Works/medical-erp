openapi: 3.1.0
info:
  title: MENO API — proposed auth endpoints (not built yet)
  version: v1-proposed
  description: |
    PROPOSED contract for the P1 auth pages that meno-api doesn't serve yet (PAGES.md §A: accept invitation).
    Forgot / reset password moved to meno-api in PR #55, mobile OTP in the AUT-04 PR (#867). The web app calls these through MSW mocks until they exist.
    Everything else (login, refresh, logout, me, sign-up, email and mobile verification, password reset, GSTIN fetch, onboarding) is real and
    lives in ../meno-api.yaml (generated by springdoc).

    When an endpoint is built, delete it here in the same PR and run `pnpm gen:api`. Field names and rules match
    packages/validation. Errors: Problem Details with `code` (MODULE_REASON).
  x-owner: Nitheesh (backend auth, identity)
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/invitations/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 100 } }]
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: Who invited you, to which business, with which role (PLT-06)
      security: []
      responses:
        "200": { description: Invitation, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationView" } } } }
        "410": { description: IDENTITY_INVITATION_INVALID (unknown, expired or used; one code so tokens can't be probed), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/invitations/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 100 } }]
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Create the user from the invitation and sign in (sets meno_refresh like login)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AcceptInvitationRequest" } } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/TokenResponse" } } } }
        "400": { description: Field errors, IDENTITY_PASSWORD_TOO_SHORT, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "410": { description: IDENTITY_INVITATION_INVALID, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, code: { type: string }, attemptsLeft: { type: integer } }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string }
        expiresIn: { type: integer, format: int64 }
        user:
          type: object
          required: [id, tenantId, email, fullName, roles]
          properties: { id: { type: string, format: uuid }, tenantId: { type: string, format: uuid }, email: { type: string }, fullName: { type: string }, roles: { type: array, items: { type: string } } }
    InvitationView:
      type: object
      required: [businessName, roleName, invitedByName, contactMasked, expiresAt, minPasswordLength]
      properties:
        businessName: { type: string }
        roleName: { type: string }
        branchNames: { type: array, items: { type: string } }
        invitedByName: { type: string }
        contactMasked: { type: string }
        expiresAt: { type: string, format: date-time }
        minPasswordLength: { type: integer }
    AcceptInvitationRequest:
      type: object
      required: [fullName, mobile, password]
      properties:
        fullName: { type: string, maxLength: 100 }
        mobile: { type: string, pattern: "^[6-9][0-9]{9}$" }
        password: { type: string, maxLength: 128 }
