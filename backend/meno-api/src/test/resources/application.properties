# Test defaults (this file wins over application.yml for the keys below).
# Integration tests sign up many tenants from 127.0.0.1; RateLimitIntegrationTest switches limits back on.
meno.rate-limit.enabled=false
# No live calls to the online PIN directory from tests; PostalPincodeAdapterTest uses a local stub server.
meno.integrations.pincode.provider=none
