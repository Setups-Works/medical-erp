# ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
meno:
  security:
    jwt:
      # Without MENO_JWT_*_KEY_PATH a throw-away key is used; tokens die on restart. Never in staging/prod.
      allow-ephemeral-key: true
  auth:
    refresh-cookie-secure: ${MENO_COOKIE_SECURE:false}
  sms:
    # Prints SMS (with the OTP) to the log so you can verify a mobile locally. Never use log outside local.
    provider: ${MENO_SMS_PROVIDER:log}
springdoc:
  api-docs:
    enabled: ${MENO_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${MENO_API_DOCS_ENABLED:true}
