# Every value can be overridden by an env var (names match infrastructure/env/*.example).
# No secrets here: passwords and key files come from the environment only.
server:
  # App Service (Java SE) sends traffic to port 80 and sets SERVER_PORT/PORT; locally 8080.
  port: ${PORT:8080}
  # TLS ends at the Azure front end / nginx. "native" = Tomcat RemoteIpValve: X-Forwarded-For / -Proto are honoured
  # only from trusted (private-range) proxies, so clients cannot spoof their IP for rate limits.
  forward-headers-strategy: native
  shutdown: graceful

spring:
  mail:
    # Any SMTP relay (Mailpit locally on 1025). Empty host = emails are logged, not sent.
    host: ${MENO_MAIL_HOST:}
    port: ${MENO_MAIL_PORT:587}
    username: ${MENO_MAIL_USER:}
    password: ${MENO_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MENO_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MENO_MAIL_STARTTLS:true}
      # Implicit TLS for port 465 (e.g. Hostinger): MENO_MAIL_SSL=true and MENO_MAIL_STARTTLS=false.
      mail.smtp.ssl.enable: ${MENO_MAIL_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: meno-api
  datasource:
    url: ${MENO_DB_URL:jdbc:postgresql://localhost:5432/meno}
    username: ${MENO_DB_USER:meno_app}
    password: ${MENO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${MENO_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    # Migrations run as the owner role; the app runs as meno_app (no DDL rights).
    user: ${MENO_FLYWAY_USER:${MENO_DB_USER:meno_app}}
    password: ${MENO_FLYWAY_PASSWORD:${MENO_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  modulith:
    # Only packages with @ApplicationModule are modules (modules/<name>); common, config and security are shared.
    detection-strategy: explicitly-annotated

meno:
  security:
    jwt:
      issuer: ${MENO_JWT_ISSUER:meno}
      key-id: ${MENO_JWT_KID:meno-local-1}
      access-token-ttl: ${MENO_JWT_ACCESS_TTL:PT15M}
      private-key-path: ${MENO_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${MENO_JWT_PUBLIC_KEY_PATH:}
      # Where the host has no secret files (Azure App Service): the PEM text, ideally a Key Vault reference.
      private-key-pem: ${MENO_JWT_PRIVATE_KEY:}
      public-key-pem: ${MENO_JWT_PUBLIC_KEY:}
      allow-ephemeral-key: false
  auth:
    refresh-token-ttl: ${MENO_JWT_REFRESH_TTL:P30D}
    refresh-cookie-secure: ${MENO_COOKIE_SECURE:true}
    password-reset:
      ttl: ${MENO_PASSWORD_RESET_TTL:PT30M}
      cooldown: ${MENO_PASSWORD_RESET_COOLDOWN:PT60S}
      link-base: ${MENO_PUBLIC_WEB_URL:http://localhost:3000}/reset-password/?token=
  identity:
    max-failed-attempts: ${MENO_LOGIN_MAX_FAILED_ATTEMPTS:10}
    lock-duration: ${MENO_LOGIN_LOCK_DURATION:PT15M}
    min-password-length: ${MENO_MIN_PASSWORD_LENGTH:10}
    verification:
      email-ttl: ${MENO_EMAIL_VERIFICATION_TTL:PT24H}
      resend-cooldown: ${MENO_VERIFICATION_RESEND_COOLDOWN:PT60S}
      # Trailing slash: the web app is a static export with trailingSlash (apps/web/next.config.ts).
      email-link-base: ${MENO_PUBLIC_WEB_URL:http://localhost:3000}/verify/?token=
    bootstrap:
      tenant-name: ${MENO_BOOTSTRAP_TENANT:}
      full-name: ${MENO_BOOTSTRAP_NAME:Owner}
      email: ${MENO_BOOTSTRAP_EMAIL:}
      password: ${MENO_BOOTSTRAP_PASSWORD:}

  mail:
    from: ${MENO_MAIL_FROM:MENO <no-reply@meno.local>}
  signup:
    # false closes public sign-up (POST /api/v1/auth/signup answers IDENTITY_SIGNUP_CLOSED).
    enabled: ${MENO_SIGNUP_ENABLED:true}
    start-options: ${MENO_SIGNUP_START_OPTIONS:TRIAL,DEMO,LICENSE_KEY}
    # Version of the terms + privacy (DPDP) notice shown on /signup; stored with every acceptance (Hub #868).
    terms-version: ${MENO_SIGNUP_TERMS_VERSION:draft-2026-11}

  onboarding:
    financial-year-start-month: ${MENO_FY_START_MONTH:4}
    go-live-max-days-ahead: ${MENO_GO_LIVE_MAX_DAYS_AHEAD:7}
  integrations:
    gstin:
      # GST verification provider: none (default; manual entry) | gstverify (candidate, R-31 not decided ⚠).
      provider: ${MENO_GSTIN_PROVIDER:none}
      base-url: ${MENO_GSTIN_BASE_URL:https://api.gstverify.dubey.app}
      api-key: ${MENO_GSTIN_API_KEY:}
      timeout: ${MENO_GSTIN_TIMEOUT:PT8S}
  party:
    gstin:
      cache-ttl: ${MENO_GSTIN_CACHE_TTL:PT24H}
      lookups-per-minute-per-tenant: ${MENO_GSTIN_LOOKUPS_PER_MINUTE:30}
  rate-limit:
    enabled: ${MENO_RATE_LIMIT_ENABLED:true}
    rules:
      login: { method: POST, path: /api/v1/auth/login, capacity: "${MENO_RATE_LIMIT_LOGIN:10}", window: PT1M }
      refresh: { method: POST, path: /api/v1/auth/refresh, capacity: "${MENO_RATE_LIMIT_REFRESH:30}", window: PT1M }
      signup: { method: POST, path: /api/v1/auth/signup, capacity: "${MENO_RATE_LIMIT_SIGNUP:5}", window: PT10M }
      verify-email: { method: POST, path: /api/v1/auth/verify-email, capacity: "${MENO_RATE_LIMIT_VERIFY:10}", window: PT10M }
      password-forgot: { method: POST, path: /api/v1/auth/password/forgot, capacity: "${MENO_RATE_LIMIT_PASSWORD_FORGOT:5}", window: PT15M }
      password-reset: { method: POST, path: /api/v1/auth/password/reset, capacity: "${MENO_RATE_LIMIT_PASSWORD_RESET:10}", window: PT15M }
      verify-email-resend: { method: POST, path: /api/v1/auth/verify-email/resend, capacity: "${MENO_RATE_LIMIT_RESEND:5}", window: PT1H }

springdoc:
  # Off unless asked for: local and staging set MENO_API_DOCS_ENABLED=true, production leaves it false.
  api-docs:
    enabled: ${MENO_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${MENO_API_DOCS_ENABLED:false}
    path: /swagger-ui.html
    persist-authorization: true
  paths-to-match: /api/**
  writer-with-order-by-keys: true

management:
  health:
    # SMTP is optional (no host = emails are only logged) and an SMTP outage must not mark the API as down:
    # App Service and the deploy smoke test use /actuator/health.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
