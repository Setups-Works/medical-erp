# Claude on GitHub: mention @claude in an issue, a PR comment or a PR review and Claude answers,
# reviews, or pushes a fix to its own branch and offers a PR. It reads CLAUDE.md and AGENTS.md, so the
# repo rules apply (no pushes to main/develop, no AI attribution, docs-first in the FOUNDATION phase).
#
# Needs ONE repo secret (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY        an Anthropic API key, or
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (Claude Pro / Max subscription)
#
# Rollback: delete this file (or disable the workflow in the Actions tab). Nothing else depends on it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# One run at a time per issue / PR; a new mention waits for the previous run instead of racing it.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only people with write access to the repo (owner, org member, collaborator) can trigger Claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push to its own feature/claude-* branch (branch protection still guards main/develop)
      pull-requests: write   # comment on and review PRs
      issues: write          # comment on issues
      id-token: write        # used by the action to authenticate the Claude GitHub app
      actions: read          # read CI results when asked about a failing check
    steps:
      # Actions pinned to a commit (supply chain, SEC-08). Tag in the comment; bump both together.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Our branching rules: work starts from develop, branches look like feature/<issue#>-name.
          base_branch: develop
          branch_prefix: "feature/claude-"
          branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
