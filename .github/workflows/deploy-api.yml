# Auto-deploy meno-api to Azure App Service (Java 21, shared B1 plan, ADR-0018; Hub #135 / #141).
#   push to develop -> GitHub Environment "staging"    -> staging App Service
#   push to main    -> GitHub Environment "production" -> production App Service
# Each Environment holds (Settings -> Environments):
#   variable AZURE_WEBAPP_NAME             the App Service name (URL https://<name>.azurewebsites.net)
#   and EITHER OIDC (preferred, SEC-08; set up with infrastructure/azure/setup-oidc.sh):
#     variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (a managed identity, no password)
#   OR the fallback:
#     secret   AZURE_WEBAPP_PUBLISH_PROFILE  the app's publish profile XML
# App settings (DB, JWT keys, ...) live on the App Service itself, never here. Setup: docs/deployment/AZURE_APP_SERVICE.md
# Rollback: docs/runbooks/rollback.md (re-run the last good run of this workflow). To stop auto-deploys,
# disable this workflow in the Actions tab.
name: Deploy API

on:
  push:
    branches: [develop, main]
    paths:
      - backend/meno-api/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify + package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/meno-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Same gate as CI: nothing is deployed unless every test passes on this exact commit.
      - run: ./mvnw -B -ntp verify
      - name: Rename jar
        run: cp target/meno-api-*.jar target/app.jar
      - uses: actions/upload-artifact@v7
        with:
          name: meno-api-jar
          path: backend/meno-api/target/app.jar
          retention-days: 30

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: build
    # Only the two long-lived branches deploy; a manual run from any other branch stops here.
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write   # OIDC token for azure/login; unused with a publish profile
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    # One deploy per environment at a time; a newer push waits instead of cancelling a half-done deploy.
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check environment settings
        env:
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          missing=0
          [ -n "$APP" ] || { echo "::error::Variable AZURE_WEBAPP_NAME is not set in this GitHub Environment."; missing=1; }
          if [ -n "$CLIENT" ]; then echo "Signing in with OIDC (managed identity)."
          elif [ -n "$PROFILE" ]; then echo "::warning::Using the publish profile. Switch to OIDC: infrastructure/azure/setup-oidc.sh"
          else echo "::error::Set AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID (OIDC) or the AZURE_WEBAPP_PUBLISH_PROFILE secret."; missing=1
          fi
          exit $missing
      - uses: actions/download-artifact@v8
        with:
          name: meno-api-jar
      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          # Empty when OIDC is set up: the action then uses the azure/login session.
          publish-profile: ${{ vars.AZURE_CLIENT_ID == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE || '' }}
          package: app.jar
          type: JAR
          clean: true
          restart: true
      # Allow up to ~10 minutes for the JVM start and Flyway migrations after the restart.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
          IS_PROD: ${{ github.ref_name == 'main' }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$URL/actuator/health" | grep -q '"UP"'; then
              echo "Healthy: $URL/actuator/health"
              break
            fi
            [ "$i" = 40 ] && { echo "::error::$URL did not report UP. See docs/runbooks/rollback.md"; exit 1; }
            sleep 15
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$URL/api/v1/auth/login")
          [ "$code" = 400 ] || { echo "::error::POST /api/v1/auth/login with an empty body returned $code, expected 400"; exit 1; }
          if [ "$IS_PROD" = true ]; then
            docs=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v3/api-docs")
            [ "$docs" = 404 ] || { echo "::error::Production serves /v3/api-docs ($docs). Set MENO_API_DOCS_ENABLED=false."; exit 1; }
          fi
          echo "Smoke test passed: $URL"
