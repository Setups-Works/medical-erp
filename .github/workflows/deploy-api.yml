# Auto-deploy meno-api to Azure App Service (Java 21, shared B1 plan, ADR-0018; Hub #135 / #141).
#   push to develop -> GitHub Environment "staging"    -> staging App Service
#   push to main    -> GitHub Environment "production" -> production App Service
# Each Environment holds (Settings -> Environments):
#   variable AZURE_WEBAPP_NAME             the App Service name (URL https://<name>.azurewebsites.net)
#   and EITHER OIDC (preferred, SEC-08; set up with infrastructure/azure/setup-oidc.sh):
#     variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (a managed identity, no password)
#   OR the fallback:
#     secret   AZURE_WEBAPP_PUBLISH_PROFILE  the app's publish profile XML
# App settings (DB, JWT keys, ...) live on the App Service itself, never here. Setup: docs/deployment/AZURE_APP_SERVICE.md
# Rollback: docs/runbooks/rollback.md (re-run the last good run of this workflow). To stop auto-deploys,
# disable this workflow in the Actions tab.
name: Deploy API

on:
  push:
    branches: [develop, main]
    paths:
      - backend/meno-api/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify + package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Several merges in a row: only the newest commit is built and deployed. Back-to-back restarts on the
    # shared B1 pinned its CPU at 100% and made each start take minutes (26-11-2026).
    concurrency:
      group: deploy-api-build-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend/meno-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Same gate as CI: nothing is deployed unless every test passes on this exact commit.
      - run: ./mvnw -B -ntp verify
      - name: Rename jar
        run: cp target/meno-api-*.jar target/app.jar
      - uses: actions/upload-artifact@v7
        with:
          name: meno-api-jar
          path: backend/meno-api/target/app.jar
          retention-days: 30

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: build
    # Only the two long-lived branches deploy; a manual run from any other branch stops here.
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write   # OIDC token for azure/login; unused with a publish profile
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    # One deploy per environment at a time; a newer push waits instead of cancelling a half-done deploy.
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check environment settings
        env:
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          missing=0
          [ -n "$APP" ] || { echo "::error::Variable AZURE_WEBAPP_NAME is not set in this GitHub Environment."; missing=1; }
          if [ -n "$CLIENT" ]; then echo "Signing in with OIDC (managed identity)."
          elif [ -n "$PROFILE" ]; then echo "::warning::Using the publish profile. Switch to OIDC: infrastructure/azure/setup-oidc.sh"
          else echo "::error::Set AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID (OIDC) or the AZURE_WEBAPP_PUBLISH_PROFILE secret."; missing=1
          fi
          exit $missing
      - uses: actions/download-artifact@v8
        with:
          name: meno-api-jar
      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Calls the OneDeploy API directly instead of azure/webapps-deploy: that action first asks Kudu for the
      # app's runtime OS, and on a busy plan this lookup alone took 12+ minutes (run 45856408961) before the
      # 20-second upload even started. Same API, same flags (type=jar, clean, restart).
      - id: deploy
        name: Deploy jar (OneDeploy)
        env:
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
          USE_OIDC: ${{ vars.AZURE_CLIENT_ID != '' }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          api="https://$APP.scm.azurewebsites.net/api/publish?type=jar&clean=true&restart=true"
          if [ "$USE_OIDC" = true ]; then
            token=$(az account get-access-token --query accessToken -o tsv)
            echo "::add-mask::$token"
            auth=(-H "Authorization: Bearer $token")
          else
            # Credentials of the ZipDeploy entry in the publish profile (the same pair the action used).
            entry=$(printf '%s' "$PROFILE" | tr -d '\n' | grep -o '<publishProfile [^>]*publishMethod="ZipDeploy"[^>]*>')
            user=$(printf '%s' "$entry" | sed -n 's/.*userName="\([^"]*\)".*/\1/p')
            pass=$(printf '%s' "$entry" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p')
            [ -n "$user" ] && [ -n "$pass" ] || { echo "::error::No ZipDeploy credentials in AZURE_WEBAPP_PUBLISH_PROFILE."; exit 1; }
            echo "::add-mask::$pass"
            auth=(-u "$user:$pass")
          fi
          # Synchronous: returns when Kudu has placed the jar and triggered the restart.
          code=$(curl -sS -o deploy.out -w '%{http_code}' --retry 3 --retry-all-errors --max-time 600 \
            "${auth[@]}" -X POST -H 'Content-Type: application/octet-stream' --data-binary @app.jar "$api")
          if [ "${code:0:1}" != 2 ]; then
            echo "::error::OneDeploy returned HTTP $code"; cat deploy.out; exit 1
          fi
          echo "Deployed app.jar to $APP (HTTP $code)"
          echo "webapp-url=https://$APP.azurewebsites.net" >> "$GITHUB_OUTPUT"
      # OneDeploy returns before the restart, so the old JVM can still answer UP for a few seconds (run
      # 45861317851 passed against the old instance). First wait for the restart to take the app down, then
      # allow up to ~10 minutes for the new JVM and Flyway. Polls every 5 s.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
          IS_PROD: ${{ github.ref_name == 'main' }}
        run: |
          for i in $(seq 1 36); do
            if ! curl -fsS --max-time 10 "$URL/actuator/health" 2>/dev/null | grep -q '"UP"'; then
              echo "Restart seen after ~$((i * 5)) s"
              break
            fi
            [ "$i" = 36 ] && { echo "::error::$URL never went down for the restart in 3 minutes, so the new jar is not verified."; exit 1; }
            sleep 5
          done
          for i in $(seq 1 120); do
            if curl -fsS --max-time 10 "$URL/actuator/health" 2>/dev/null | grep -q '"UP"'; then
              echo "Healthy after ~$((i * 5)) s: $URL/actuator/health"
              break
            fi
            [ "$i" = 120 ] && { echo "::error::$URL did not report UP. See docs/runbooks/rollback.md"; exit 1; }
            sleep 5
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$URL/api/v1/auth/login")
          [ "$code" = 400 ] || { echo "::error::POST /api/v1/auth/login with an empty body returned $code, expected 400"; exit 1; }
          if [ "$IS_PROD" = true ]; then
            docs=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v3/api-docs")
            [ "$docs" = 404 ] || { echo "::error::Production serves /v3/api-docs ($docs). Set MENO_API_DOCS_ENABLED=false."; exit 1; }
          fi
          echo "Smoke test passed: $URL"
